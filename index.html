<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">

<title>Ninja Math</title>

<style>
:root{
  --black:#111111;
  --black2:#202020;
  --yellow:#FFD51E;
  --gold:#FFB800;
  --white:#FFFFFF;
  --bg:#F7F5ED;
  --green:#50C878;
  --red:#FF6B6B;
  --muted:#777;
  --shadow:0 10px 28px rgba(0,0,0,.10);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:#222;
  font-family:"Arial Rounded MT Bold",Arial,sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.app{
  max-width:1100px;
  min-height:100vh;
  margin:auto;
  background:#FAF9F3;
  padding-bottom:95px;
}

/* HEADER */

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:16px 20px;
  color:white;
  background:linear-gradient(135deg,#101010,#292929);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
}

.logo{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:var(--yellow);
  color:#111;
  font-size:27px;
}

.brand small{
  display:block;
  color:#ccc;
  font-size:10px;
  margin-top:2px;
}

.header-actions{
  display:flex;
  gap:7px;
}

.pill{
  padding:9px 12px;
  color:white;
  background:#333;
  border:1px solid #555;
  border-radius:999px;
}

/* GENERAL */

.screen{
  display:none;
  padding:18px;
}

.screen.active{
  display:block;
}

.card{
  padding:18px;
  background:white;
  border-radius:22px;
  box-shadow:var(--shadow);
}

.grid{
  display:grid;
  gap:14px;
}

.btn{
  padding:14px 18px;
  border-radius:15px;
  background:var(--yellow);
  color:#111;
  font-weight:900;
  box-shadow:0 5px 0 #C79E00;
}

.btn:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #C79E00;
}

.btn.dark{
  color:white;
  background:#171717;
  box-shadow:0 5px 0 #000;
}

.btn.ghost{
  background:white;
  border:2px solid #ddd;
  box-shadow:none;
}

.btn.danger{
  color:#B91C1C;
  background:#FFF2F2;
  border:2px solid #FFD0D0;
  box-shadow:none;
}

.btn.small{
  padding:9px 12px;
  font-size:13px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:10px;
  margin:22px 2px 12px;
}

.section-title h2{
  margin:0;
}

.section-title span{
  color:var(--muted);
  font-size:12px;
}

/* HERO */

.hero{
  display:grid;
  grid-template-columns:1.5fr .5fr;
  gap:20px;
  padding:24px;
  overflow:hidden;
  border-radius:30px;
  background:linear-gradient(135deg,#FFF7B2,#FFE138);
  box-shadow:var(--shadow);
}

.hero h1{
  margin:8px 0;
  font-size:clamp(30px,6vw,48px);
}

.hero p{
  color:#594B00;
}

.mascot{
  display:grid;
  place-items:center;
  font-size:110px;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:10px;
  background:#F1F1F1;
  font-size:11px;
  font-weight:900;
}

/* STATS */

.stats{
  grid-template-columns:repeat(4,1fr);
  margin:18px 0;
}

.stat b{
  display:block;
  font-size:25px;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

/* PROGRESS */

.progress{
  height:13px;
  overflow:hidden;
  border-radius:999px;
  background:#EAEAEA;
}

.progress i{
  display:block;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--gold),var(--yellow));
}

/* MISSION */

.mission{
  color:white;
  background:#181818;
}

.mission .progress{
  background:#393939;
}

/* TOPICS */

.topics{
  grid-template-columns:repeat(3,1fr);
}

.topic{
  min-height:165px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.topic-icon{
  font-size:40px;
}

.topic h3{
  margin:8px 0 4px;
}

.topic p{
  margin:0;
  color:#777;
  font-size:12px;
}

.topic footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:15px;
}

/* NAV */

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:0;
  z-index:100;
  transform:translateX(-50%);
  width:min(1100px,100%);
  display:grid;
  grid-template-columns:repeat(6,1fr);
  padding:7px 5px calc(7px + env(safe-area-inset-bottom));
  background:white;
  border-top:1px solid #ddd;
}

.nav-btn{
  padding:8px 3px;
  border-radius:12px;
  color:#777;
  background:transparent;
  font-size:11px;
}

.nav-btn strong{
  display:block;
  font-size:21px;
}

.nav-btn.active{
  color:#111;
  background:#FFF4AD;
}

/* PROFILE */

.profile-list{
  grid-template-columns:repeat(3,1fr);
}

.child-card{
  text-align:center;
  border:3px solid transparent;
}

.child-card.selected{
  border-color:var(--yellow);
}

.child-avatar{
  font-size:58px;
}

.child-select{
  cursor:pointer;
}

.delete-profile{
  width:100%;
  margin-top:10px;
}

/* FORM */

.form-grid{
  grid-template-columns:1fr 1fr;
}

label{
  display:block;
  color:#555;
  font-size:12px;
  font-weight:900;
}

input,
select{
  width:100%;
  padding:13px;
  margin-top:6px;
  border:2px solid #ddd;
  border-radius:14px;
  background:white;
}

/* QUIZ */

.quiz-wrap{
  max-width:720px;
  margin:auto;
}

.quiz-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.question{
  padding:38px 10px 28px;
  text-align:center;
  font-size:clamp(28px,6vw,48px);
  font-weight:900;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.answer{
  min-height:80px;
  padding:12px;
  border:3px solid #eee;
  border-radius:20px;
  background:white;
  font-size:25px;
  font-weight:900;
}

.answer:hover{
  border-color:var(--yellow);
}

.answer.correct{
  border-color:#42B96D;
  background:#DBF7E5;
}

.answer.wrong{
  border-color:#FF7070;
  background:#FFE1E1;
}

.feedback{
  min-height:65px;
  margin-top:16px;
  padding:15px;
  text-align:center;
  border-radius:18px;
  font-weight:900;
}

.feedback.correct{
  background:#DDF7E6;
}

.feedback.wrong{
  background:#FFF0D8;
}

/* RESULT */

.center{
  text-align:center;
}

.result-avatar{
  font-size:90px;
}

.result-score{
  font-size:70px;
  font-weight:900;
}

.result-stars{
  font-size:45px;
  letter-spacing:5px;
}

/* RANKING */

.rank-row{
  display:grid;
  grid-template-columns:45px 1fr auto;
  gap:10px;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.rank-position{
  width:37px;
  height:37px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#F1F1F1;
  font-weight:900;
}

/* PARENT */

.performance-row{
  margin:14px 0;
}

.performance-row header{
  display:flex;
  justify-content:space-between;
  margin-bottom:5px;
  font-size:13px;
}

.parent-two-column{
  grid-template-columns:1fr 1fr;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:105px;
  z-index:999;
  transform:translateX(-50%);
  padding:12px 18px;
  color:white;
  background:#111;
  border-radius:14px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
}

/* RESPONSIVE */

@media(max-width:760px){

  .hero{
    grid-template-columns:1fr;
  }

  .mascot{
    display:none;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .topics{
    grid-template-columns:1fr 1fr;
  }

  .profile-list{
    grid-template-columns:1fr 1fr;
  }

  .nav-btn span{
    display:none;
  }

}

@media(max-width:430px){

  .screen{
    padding:14px;
  }

  .topics,
  .profile-list,
  .parent-two-column{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .answers{
    grid-template-columns:1fr;
  }

  .answer{
    min-height:65px;
  }

}
</style>
</head>

/* =========================================================
   SOUND
========================================================= */

function playSound(type){

if(!state.sound)
return;

try{

const context =
new AudioContext();

const oscillator =
context.createOscillator();

const gain =
context.createGain();

oscillator.connect(gain);

gain.connect(
context.destination
);

oscillator.frequency.value =
type === "correct"
?
650
:
280;

gain.gain.setValueAtTime(
0.08,
context.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.001,
context.currentTime + .2
);

oscillator.start();

oscillator.stop(
context.currentTime + .2
);

}
catch(error){}

}

/* =========================================================
   QUESTION GENERATOR
========================================================= */

function randomNumber(min,max){

return Math.floor(
Math.random() * (max-min+1)
) + min;

}


function shuffle(array){

return [...array]
.sort(()=>Math.random() - .5);

}


function makeQuestion(
question,
answer,
options
){

return{
question,
answer,
options:
shuffle(options)
};

}


function generateQuestion(topic){

const difficulty =
state.difficulty;

let maxNumber =

difficulty === 1 ? 10 :

difficulty === 2 ? 20 :

difficulty === 3 ? 50 :

100;


if(topic === "addition"){

const a =
randomNumber(1,maxNumber/2);

const b =
randomNumber(1,maxNumber/2);

const answer =
a+b;

return makeQuestion(

`${a} + ${b} = ?`,

answer,

[
answer,
answer+1,
Math.max(0,answer-1),
answer+2
]

);

}


if(topic === "subtraction"){

let a =
randomNumber(2,maxNumber);

let b =
randomNumber(1,a);

const answer =
a-b;

return makeQuestion(

`${a} − ${b} = ?`,

answer,

[
answer,
answer+1,
Math.max(0,answer-1),
answer+2
]

);

}


if(topic === "numbers"){

const types =
["after","before","greater","sequence"];

const type =
types[
randomNumber(0,types.length-1)
];


if(type === "after"){

const n =
randomNumber(1,maxNumber-1);

return makeQuestion(

`What number comes after ${n}?`,

n+1,

[
n,
n+1,
n+2,
Math.max(0,n-1)
]

);

}


if(type === "before"){

const n =
randomNumber(2,maxNumber);

return makeQuestion(

`What number comes before ${n}?`,

n-1,

[
n,
n-1,
n+1,
Math.max(0,n-2)
]

);

}


if(type === "greater"){

const a =
randomNumber(1,maxNumber);

let b =
randomNumber(1,maxNumber);

while(b === a)
b =
randomNumber(1,maxNumber);

const answer =
Math.max(a,b);

return makeQuestion(

`Which number is greater?`,

answer,

[
a,
b,
Math.max(0,a-1),
b+1
]

);

}


const n =
randomNumber(1,maxNumber-3);

return makeQuestion(

`${n}, ${n+1}, __, ${n+3}`,

n+2,

[
n+1,
n+2,
n+3,
n+4
]

);

}


if(topic === "money"){

const a =
randomNumber(1,10);

const b =
randomNumber(1,10);

const answer =
a+b;

return makeQuestion(

`RM${a} + RM${b} = ?`,

`RM${answer}`,

[
`RM${answer}`,
`RM${answer+1}`,
`RM${Math.max(1,answer-1)}`,
`RM${answer+2}`
]

);

}


if(topic === "fractions"){

const questions = [

makeQuestion(
"One of two equal parts is called...",
"Half",
["Whole","Half","Quarter","Three"]
),

makeQuestion(
"One of four equal parts is called...",
"Quarter",
["Half","Quarter","Whole","Two"]
),

makeQuestion(
"How many halves make one whole?",
2,
[1,2,3,4]
),

makeQuestion(
"How many quarters make one whole?",
4,
[2,3,4,5]
),

makeQuestion(
"Which is bigger?",
"Half",
["Half","Quarter","Same","None"]
)

];

return questions[
randomNumber(0,questions.length-1)
];

}


if(topic === "time"){

const questions = [

makeQuestion(
"How many days are in one week?",
7,
[5,6,7,8]
),

makeQuestion(
"After Monday comes...",
"Tuesday",
["Sunday","Tuesday","Friday","Saturday"]
),

makeQuestion(
"Before Friday is...",
"Thursday",
["Monday","Thursday","Saturday","Sunday"]
),

makeQuestion(
"How many months are in one year?",
12,
[10,11,12,13]
),

makeQuestion(
"Breakfast is usually in the...",
"Morning",
["Morning","Night","Evening","Midnight"]
)

];

return questions[
randomNumber(0,questions.length-1)
];

}


if(topic === "measurement"){

const questions = [

makeQuestion(
"An elephant is usually...",
"Heavy",
["Light","Heavy","Empty","Short"]
),

makeQuestion(
"A feather is usually...",
"Light",
["Heavy","Light","Full","Long"]
),

makeQuestion(
"Which can hold more water?",
"Bucket",
["Spoon","Bucket","Bottle cap","Coin"]
),

makeQuestion(
"Which measures length?",
"Ruler",
["Clock","Ruler","Calendar","Coin"]
),

makeQuestion(
"A broom is usually ___ than a pencil.",
"Longer",
["Shorter","Longer","Lighter","Empty"]
)

];

return questions[
randomNumber(0,questions.length-1)
];

}


if(topic === "shapes"){

const questions = [

makeQuestion(
"Which shape has 3 sides?",
"Triangle",
["Circle","Square","Triangle","Rectangle"]
),

makeQuestion(
"Which shape is round?",
"Circle",
["Triangle","Square","Circle","Rectangle"]
),

makeQuestion(
"Which shape has 4 equal sides?",
"Square",
["Circle","Triangle","Square","Oval"]
),

makeQuestion(
"How many sides does a triangle have?",
3,
[2,3,4,5]
),

makeQuestion(
"Which shape has no corners?",
"Circle",
["Square","Triangle","Circle","Rectangle"]
)

];

return questions[
randomNumber(0,questions.length-1)
];

}


if(topic === "data"){

const questions = [

makeQuestion(
"🍎🍎🍎 and 🍌🍌. Which has more?",
"Apples",
["Apples","Bananas","Same","None"]
),

makeQuestion(
"⭐⭐⭐⭐ How many stars?",
4,
[2,3,4,5]
),

makeQuestion(
"Cats: 5, Dogs: 3. Which has more?",
"Cats",
["Cats","Dogs","Same","None"]
),

makeQuestion(
"Red: 2, Blue: 6. Which has fewer?",
"Red",
["Red","Blue","Same","None"]
),

makeQuestion(
"Ali read 2 books. Mia read 5. Who read more?",
"Mia",
["Ali","Mia","Same","Nobody"]
)

];

return questions[
randomNumber(0,questions.length-1)
];

}


return makeQuestion(
"1 + 1 = ?",
2,
[1,2,3,4]
);

}

/* =========================================================

========================================================= */

function answerQuestion(button){

if(state.answerLocked)
return;


state.answerLocked =
true;


const question =
state.questions[state.questionIndex];

const selected =
button.dataset.answer;

const correct =

String(selected) ===
String(question.answer);


const feedback =
$("#feedback");


if(correct){

state.correctAnswers++;

button.classList.add("correct");

feedback.className =
"feedback correct";

feedback.textContent =
t("correct");

playSound("correct");

}

else{

button.classList.add("wrong");

document
.querySelectorAll(".answer")
.forEach(answerButton=>{

if(
String(answerButton.dataset.answer)
===
String(question.answer)
){

answerButton.classList.add("correct");

}

});


feedback.className =
"feedback wrong";

feedback.innerHTML =

`${t("wrong")}<br>
Correct answer:
<strong>${question.answer}</strong>`;

playSound("wrong");

}


setTimeout(()=>{

state.questionIndex++;

state.answerLocked =
false;

renderQuestion();

},1000);

}

async function finishQuiz(){

const child =
currentChild();

const total =
state.questions.length;

const accuracy =
Math.round(
state.correctAnswers /
total * 100
);


let xpEarned =
state.correctAnswers * 10;


xpEarned +=
50;


if(accuracy === 100){

xpEarned +=
100;

}


const starsEarned =
getStars(accuracy);


child.xp +=
xpEarned;

child.stars +=
starsEarned;

child.totalQuestions +=
total;

child.correctAnswers +=
state.correctAnswers;


const oldTopicScore =
child.topics[state.currentTopic] || 0;


child.topics[state.currentTopic] =

oldTopicScore === 0
?
accuracy
:
Math.round(
(oldTopicScore + accuracy) / 2
);

topic:
state.currentTopic,

score:
`${state.correctAnswers}/${total}`,

accuracy,

date:
new Date().toLocaleDateString()

/* =========================================================
   DELETE CHILD PROFILE
========================================================= */

function deleteChild(id){

const child =
children[id];


if(!child)
return;


/*
Prevent all profiles being deleted.
At least one child profile is required.
*/

if(
Object.keys(children).length <= 1
){

toast(

state.language === "en"

?

"At least one child profile is required."

:

"Sekurang-kurangnya satu profil anak diperlukan."

);

return;

}


/*
Confirmation before deletion.
*/

const message =

state.language === "en"

?

`Delete ${child.name}'s profile?

All XP, stars, quiz history and learning progress for this child will be permanently removed.`

:

`Padam profil ${child.name}?

Semua XP, bintang, sejarah kuiz dan kemajuan pembelajaran anak ini akan dipadam.`;


const confirmed =
window.confirm(message);


if(!confirmed)
return;


/*
Delete selected child.
*/

delete children[id];


/*
If deleted child was the active profile,
automatically switch to another child.
*/

if(
state.currentChildId === id
){

state.currentChildId =
Object.keys(children)[0];

}


/*
Save locally and Firebase.
*/

saveLocal();

syncFirebase();

renderAll();


toast(

state.language === "en"

?

"Child profile deleted."

:

"Profil anak telah dipadam."

);

}

child.history.map(history=>`

<div
style="
padding:10px 0;
border-bottom:1px solid #eee;
">

<b>

${topics[history.topic]?.icon || "📘"}

${topics[history.topic]
?
topicName(history.topic)
:
history.topic}

</b>

<br>

<small>

${history.date}

•

${history.score}

•

${history.accuracy}%

</small>

</div>

`).join("")

:

`

<p style="color:#777">

No learning history yet.

</p>

`

}

</div>


<div
class="card"
style="margin-top:14px">

<h3>
⚙️ Settings
</h3>


<p>

Language:

<button
class="btn small"
onclick="toggleLanguage()">

${state.language.toUpperCase()}

</button>

</p>


<p>

Sound:

<button
class="btn small"
onclick="toggleSound()">

${state.sound ? "🔊 ON":"🔇 OFF"}

</button>

</p>

</div>

`;

}


/* =========================================================
   LANGUAGE
========================================================= */

function toggleLanguage(){

state.language =

state.language === "en"
?
"bm"
:
"en";


saveLocal();

renderAll();

}


/* =========================================================
   SOUND
========================================================= */

function toggleSound(){

state.sound =
!state.sound;


saveLocal();

renderAll();

}


/* =========================================================
   DIFFICULTY
========================================================= */

function changeDifficulty(level){

state.difficulty =
Number(level);

}


/* =========================================================
   FIREBASE SAVE
========================================================= */

async function syncFirebase(){

if(!auth.currentUser)
return;


try{

await set(

ref(

database,

`users/${auth.currentUser.uid}/ninjaMath`

),

{

children,

currentChildId:
state.currentChildId,

updatedAt:
Date.now()

}

);

}

catch(error){

console.log(
"Firebase sync error:",
error
);

}

}


/* =========================================================
   FIREBASE LOAD
========================================================= */

async function loadFirebase(user){

try{

const snapshot =
await get(

ref(

database,

`users/${user.uid}/ninjaMath`

)

);


if(snapshot.exists()){

const data =
snapshot.val();


if(data.children){

children =
data.children;

}


if(
data.currentChildId
&&
children[data.currentChildId]
){

state.currentChildId =
data.currentChildId;

}


saveLocal();

}

}

catch(error){

console.log(
"Firebase load error:",
error
);

}


renderAll();

}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll(){

$("#languageButton")
.textContent =
state.language.toUpperCase();


$("#soundButton")
.textContent =
state.sound
?
"🔊"
:
"🔇";


renderHome();

renderLearn();

renderMissions();

renderRanking();

renderProfile();

renderParent();

}


/* =========================================================
   NAVIGATION EVENTS
========================================================= */

document
.querySelectorAll(".nav-btn")
.forEach(button=>{

button.addEventListener(
"click",
()=>showPage(
button.dataset.page
)
);

});


$("#languageButton")
.addEventListener(
"click",
toggleLanguage
);


$("#soundButton")
.addEventListener(
"click",
toggleSound
);


/* =========================================================
   EXPORT FUNCTIONS FOR HTML ONCLICK
========================================================= */

window.showPage =
showPage;

window.startQuiz =
startQuiz;

window.answerQuestion =
answerQuestion;

window.selectChild =
selectChild;

window.addChild =
addChild;

window.deleteChild =
deleteChild;

window.toggleLanguage =
toggleLanguage;

window.toggleSound =
toggleSound;

window.changeDifficulty =
changeDifficulty;


/* =========================================================
   FIREBASE AUTH
========================================================= */

onAuthStateChanged(
auth,
user=>{

if(user){

loadFirebase(user);

}

});


signInAnonymously(auth)

.catch(error=>{

console.log(
"Anonymous login error:",
error
);

/*
App will still work using localStorage
even if Firebase Anonymous Auth
has not been enabled.
*/

});


/* =========================================================
   START APP
========================================================= */

renderAll();

</script>

</body>
</html>
