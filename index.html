<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111111">

<title>Ninja Math</title>

<style>
:root{
  --black:#111111;
  --black2:#222222;
  --yellow:#FFD51E;
  --gold:#FFB800;
  --white:#FFFFFF;
  --bg:#F7F5ED;
  --green:#50C878;
  --red:#FF6B6B;
  --blue:#4FA3FF;
  --purple:#9B72FF;
  --muted:#777;
  --shadow:0 10px 28px rgba(0,0,0,.10);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:#222;
  font-family:"Arial Rounded MT Bold",Arial,sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.app{
  max-width:1100px;
  min-height:100vh;
  margin:auto;
  background:#FAF9F3;
  padding-bottom:100px;
}

/* =========================================================
   HEADER
========================================================= */

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:16px 20px;
  color:white;
  background:linear-gradient(135deg,#101010,#292929);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
}

.logo{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:var(--yellow);
  color:#111;
  font-size:27px;
}

.brand small{
  display:block;
  color:#ccc;
  font-size:10px;
  margin-top:2px;
}

.header-actions{
  display:flex;
  gap:7px;
}

.pill{
  padding:9px 12px;
  color:white;
  background:#333;
  border:1px solid #555;
  border-radius:999px;
}

/* =========================================================
   GENERAL
========================================================= */

.screen{
  display:none;
  padding:18px;
}

.screen.active{
  display:block;
}

.card{
  padding:18px;
  background:white;
  border-radius:22px;
  box-shadow:var(--shadow);
}

.grid{
  display:grid;
  gap:14px;
}

.btn{
  padding:14px 18px;
  border-radius:15px;
  background:var(--yellow);
  color:#111;
  font-weight:900;
  box-shadow:0 5px 0 #C79E00;
}

.btn:hover{
  filter:brightness(.98);
}

.btn:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #C79E00;
}

.btn.dark{
  color:white;
  background:#171717;
  box-shadow:0 5px 0 #000;
}

.btn.ghost{
  background:white;
  border:2px solid #ddd;
  box-shadow:none;
}

.btn.danger{
  color:#B91C1C;
  background:#FFF2F2;
  border:2px solid #FFD0D0;
  box-shadow:none;
}

.btn.small{
  padding:9px 12px;
  font-size:13px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:10px;
  margin:22px 2px 12px;
}

.section-title h2{
  margin:0;
}

.section-title span{
  color:var(--muted);
  font-size:12px;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:10px;
  background:#F1F1F1;
  font-size:11px;
  font-weight:900;
}

/* =========================================================
   HERO
========================================================= */

.hero{
  display:grid;
  grid-template-columns:1.5fr .5fr;
  gap:20px;
  padding:24px;
  overflow:hidden;
  border-radius:30px;
  background:linear-gradient(135deg,#FFF7B2,#FFE138);
  box-shadow:var(--shadow);
}

.hero h1{
  margin:8px 0;
  font-size:clamp(30px,6vw,48px);
}

.hero p{
  color:#594B00;
}

.mascot{
  display:grid;
  place-items:center;
  font-size:110px;
}

/* =========================================================
   STATS
========================================================= */

.stats{
  grid-template-columns:repeat(4,1fr);
  margin:18px 0;
}

.stat b{
  display:block;
  font-size:25px;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress{
  height:13px;
  overflow:hidden;
  border-radius:999px;
  background:#EAEAEA;
}

.progress i{
  display:block;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--gold),var(--yellow));
}

/* =========================================================
   MISSION
========================================================= */

.mission{
  color:white;
  background:#181818;
}

.mission .progress{
  background:#393939;
}

/* =========================================================
   LEARN TOPICS
========================================================= */

.topics{
  grid-template-columns:repeat(3,1fr);
}

.topic{
  min-height:175px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.topic-icon{
  font-size:42px;
}

.topic h3{
  margin:8px 0 4px;
}

.topic p{
  margin:0;
  color:#777;
  font-size:12px;
  line-height:1.5;
}

.topic footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:15px;
}

/* =========================================================
   DIFFICULTY SCREEN
========================================================= */

.difficulty-header{
  max-width:800px;
  margin:auto;
  text-align:center;
  padding:10px 0 18px;
}

.difficulty-topic-icon{
  font-size:70px;
}

.difficulty-header h1{
  margin:6px 0;
}

.difficulty-header p{
  color:#777;
  line-height:1.5;
}

.difficulty-grid{
  max-width:850px;
  margin:auto;
  display:grid;
  gap:14px;
}

.difficulty-card{
  position:relative;
  display:grid;
  grid-template-columns:65px 1fr auto;
  gap:15px;
  align-items:center;
  padding:18px;
  border:3px solid transparent;
  border-radius:22px;
  background:white;
  box-shadow:var(--shadow);
  transition:.2s ease;
}

.difficulty-card:hover{
  transform:translateY(-2px);
  border-color:var(--yellow);
}

.difficulty-number{
  width:58px;
  height:58px;
  display:grid;
  place-items:center;
  border-radius:18px;
  font-size:24px;
  font-weight:900;
}

.level-1 .difficulty-number{
  background:#E0F8E7;
  color:#178642;
}

.level-2 .difficulty-number{
  background:#DDEFFF;
  color:#1768AA;
}

.level-3 .difficulty-number{
  background:#FFF1C8;
  color:#9A6300;
}

.level-4 .difficulty-number{
  background:#FFE0CC;
  color:#B65013;
}

.level-5 .difficulty-number{
  background:#F1E2FF;
  color:#7A28B8;
}

.difficulty-info h3{
  margin:0 0 5px;
}

.difficulty-info p{
  margin:0;
  color:#777;
  font-size:13px;
  line-height:1.5;
}

.difficulty-stars{
  margin-top:7px;
  font-size:14px;
}

/* =========================================================
   NAV
========================================================= */

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:0;
  z-index:100;
  transform:translateX(-50%);
  width:min(1100px,100%);
  display:grid;
  grid-template-columns:repeat(6,1fr);
  padding:7px 5px calc(7px + env(safe-area-inset-bottom));
  background:white;
  border-top:1px solid #ddd;
}

.nav-btn{
  padding:8px 3px;
  border-radius:12px;
  color:#777;
  background:transparent;
  font-size:11px;
}

.nav-btn strong{
  display:block;
  font-size:21px;
}

.nav-btn.active{
  color:#111;
  background:#FFF4AD;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-list{
  grid-template-columns:repeat(3,1fr);
}

.child-card{
  text-align:center;
  border:3px solid transparent;
}

.child-card.selected{
  border-color:var(--yellow);
}

.child-avatar{
  font-size:58px;
}

.child-select{
  cursor:pointer;
}

.delete-profile{
  width:100%;
  margin-top:10px;
}

/* =========================================================
   FORM
========================================================= */

.form-grid{
  grid-template-columns:1fr 1fr;
}

label{
  display:block;
  color:#555;
  font-size:12px;
  font-weight:900;
}

input,
select{
  width:100%;
  padding:13px;
  margin-top:6px;
  border:2px solid #ddd;
  border-radius:14px;
  background:white;
}

/* =========================================================
   QUIZ
========================================================= */

.quiz-wrap{
  max-width:720px;
  margin:auto;
}

.quiz-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.quiz-level{
  padding:7px 10px;
  border-radius:999px;
  color:#111;
  background:var(--yellow);
  font-size:11px;
  font-weight:900;
}

.question{
  padding:38px 10px 28px;
  text-align:center;
  font-size:clamp(27px,6vw,46px);
  font-weight:900;
  line-height:1.25;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.answer{
  min-height:80px;
  padding:12px;
  border:3px solid #eee;
  border-radius:20px;
  background:white;
  font-size:24px;
  font-weight:900;
}

.answer:hover{
  border-color:var(--yellow);
}

.answer.correct{
  border-color:#42B96D;
  background:#DBF7E5;
}

.answer.wrong{
  border-color:#FF7070;
  background:#FFE1E1;
}

.feedback{
  min-height:65px;
  margin-top:16px;
  padding:15px;
  text-align:center;
  border-radius:18px;
  font-weight:900;
}

.feedback.correct{
  background:#DDF7E6;
}

.feedback.wrong{
  background:#FFF0D8;
}

/* =========================================================
   RESULT
========================================================= */

.center{
  text-align:center;
}

.result-avatar{
  font-size:90px;
}

.result-score{
  font-size:70px;
  font-weight:900;
}

.result-stars{
  font-size:45px;
  letter-spacing:5px;
}

/* =========================================================
   RANKING
========================================================= */

.ranking-top-card{
  margin-bottom:14px;
  text-align:center;
  background:linear-gradient(135deg,#FFF5A0,#FFD51E);
}

.ranking-top-card .trophy{
  font-size:55px;
}

.rank-row{
  display:grid;
  grid-template-columns:50px 55px 1fr auto;
  gap:10px;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.rank-row:last-child{
  border-bottom:0;
}

.rank-position{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#F1F1F1;
  font-weight:900;
}

.rank-avatar{
  font-size:34px;
  text-align:center;
}

.rank-current{
  padding-left:8px;
  padding-right:8px;
  border-radius:16px;
  background:#FFF9D7;
}

.you-badge{
  display:inline-block;
  margin-left:5px;
  padding:3px 7px;
  border-radius:999px;
  color:#111;
  background:var(--yellow);
  font-size:9px;
  font-weight:900;
}

/* =========================================================
   PARENT
========================================================= */

.performance-row{
  margin:14px 0;
}

.performance-row header{
  display:flex;
  justify-content:space-between;
  margin-bottom:5px;
  font-size:13px;
}

.parent-two-column{
  grid-template-columns:1fr 1fr;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  left:50%;
  bottom:105px;
  z-index:999;
  transform:translateX(-50%);
  padding:12px 18px;
  color:white;
  background:#111;
  border-radius:14px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:760px){

  .hero{
    grid-template-columns:1fr;
  }

  .mascot{
    display:none;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .topics{
    grid-template-columns:1fr 1fr;
  }

  .profile-list{
    grid-template-columns:1fr 1fr;
  }

  .nav-btn span{
    display:none;
  }

  .difficulty-card{
    grid-template-columns:55px 1fr;
  }

  .difficulty-card .btn{
    grid-column:1 / -1;
  }
}

@media(max-width:430px){

  .screen{
    padding:14px;
  }

  .topics,
  .profile-list,
  .parent-two-column{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .answers{
    grid-template-columns:1fr;
  }

  .answer{
    min-height:65px;

  .rank-row{
    grid-template-columns:42px 45px 1fr auto;
    gap:7px;
  }
}

/* =========================================================
   SOUND
========================================================= */

function playSound(type){

if(!state.sound)
return;

try{

const context = new AudioContext();

const oscillator = context.createOscillator();

const gain = context.createGain();

oscillator.connect(gain);

gain.connect(context.destination);

oscillator.frequency.value =
type === "correct"
?
650
:
280;

gain.gain.setValueAtTime(
0.08,
context.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.001,
context.currentTime + .2
);

oscillator.start();

oscillator.stop(
context.currentTime + .2
);

}
catch(error){}

}

/* =========================================================
   RANDOM HELPERS
========================================================= */

function randomNumber(min,max){

return Math.floor(
Math.random() * (max-min+1)
) + min;

}


function shuffle(array){

return [...array]
.sort(()=>Math.random() - .5);

}


function makeQuestion(
question,
answer,
options
){

const unique =
[...new Set(options.map(String))];

while(unique.length < 4){

unique.push(
String(
Number(answer) + unique.length + 1
)
);

}

return{

question,

answer:String(answer),

options:
shuffle(unique.slice(0,4))

};

}

let a,b,answer;


if(level === 1){

a = randomNumber(0,5);
b = randomNumber(0,5);

answer = a+b;

return makeQuestion(

`${a} + ${b} = ?`,

answer,

[
answer,
answer+1,
Math.max(0,answer-1),
answer+2
]

);

}


if(level === 2){

a = randomNumber(2,10);
b = randomNumber(1,10);

answer = a+b;

return makeQuestion(

`${a} + ${b} = ?`,

answer,

[
answer,
answer+2,
answer-1,
answer+1
]

);

}


if(level === 3){

a = randomNumber(10,30);
b = randomNumber(5,20);

answer = a+b;

return makeQuestion(

`${a} + ${b} = ?`,

answer,

[
answer,
answer+10,
answer-2,
answer+2
]

);

}


if(level === 4){

a = randomNumber(20,60);
b = randomNumber(10,40);

answer = a+b;

const questionType =
randomNumber(1,2);


if(questionType === 1){

return makeQuestion(

`${a} + ${b} = ?`,

answer,

[
answer,
answer+10,
answer-10,
answer+2
]

);

}


return makeQuestion(

`Ali has ${a} stickers. He gets ${b} more. How many stickers does he have now?`,

answer,

[
answer,
answer+5,
answer-5,
answer+10
]

);

}


a = randomNumber(30,80);

b = randomNumber(10,70);

answer = a+b;


const c =
randomNumber(1,15);


const type =
randomNumber(1,2);


if(type === 1){

return makeQuestion(

`${a} + ${b} + ${c} = ?`,

answer+c,

[
answer+c,
answer+c+5,
answer+c-5,
answer+c+10
]

);

}


return makeQuestion(

`A box has ${a} pencils. Teacher adds ${b} pencils. Then she adds ${c} more. How many pencils are there?`,

answer+c,

[
answer+c,
answer+c+10,
answer+c-10,
answer+c+5
]

);

}

]

);

}

/* =========================================================
   MAIN QUESTION GENERATOR
========================================================= */

function generateQuestion(topic,level){

switch(topic){

case "addition":
return additionQuestion(level);

case "subtraction":
return subtractionQuestion(level);

case "numbers":
return numbersQuestion(level);

case "fractions":
return fractionsQuestion(level);

case "money":
return moneyQuestion(level);

case "time":
return timeQuestion(level);

case "measurement":
return measurementQuestion(level);

case "shapes":
return shapesQuestion(level);

case "data":
return dataQuestion(level);

default:
return makeQuestion(
"1 + 1 = ?",
2,
[1,2,3,4]
);

}

}

/* =========================================================
   ANSWER QUESTION
========================================================= */

function answerQuestion(button){

if(state.answerLocked)
return;


state.answerLocked = true;


const question =
state.questions[
state.questionIndex
];


const selected =
button.dataset.answer;


const correct =
String(selected)
===
String(question.answer);


const feedback =
$("#feedback");


if(correct){

state.correctAnswers++;

button.classList.add("correct");

feedback.className =
"feedback correct";

feedback.textContent =
t("correct");

playSound("correct");

}

else{

button.classList.add("wrong");


document
.querySelectorAll(".answer")
.forEach(answerButton=>{

if(
String(answerButton.dataset.answer)
===
String(question.answer)
){

answerButton.classList.add("correct");

}

});


feedback.className =
"feedback wrong";


feedback.innerHTML = `

${t("wrong")}

<br>

Correct answer:

<strong>
${question.answer}
</strong>

`;


playSound("wrong");

}


setTimeout(()=>{

state.questionIndex++;

state.answerLocked = false;

renderQuestion();

},1000);

}


/* =========================================================
   QUIZ RESULT
========================================================= */

function finishQuiz(){

const child = currentChild();

const total =
state.questions.length;


const accuracy =
Math.round(
state.correctAnswers /
total * 100
);


/*
Higher difficulty gives slightly higher XP.
*/

const difficultyBonus =
state.difficulty * 10;


let xpEarned =
state.correctAnswers * 10
+
difficultyBonus;


if(accuracy === 100){

xpEarned += 100;

}


const starsEarned =
getStars(accuracy);


child.xp += xpEarned;

child.stars += starsEarned;

child.totalQuestions += total;

child.correctAnswers += state.correctAnswers;


const oldTopicScore =
child.topics[state.currentTopic] || 0;


child.topics[state.currentTopic] =

oldTopicScore === 0
?
accuracy
:
Math.round(
(oldTopicScore + accuracy) / 2
);


child.history.unshift({

topic:state.currentTopic,

difficulty:state.difficulty,

score:
`${state.correctAnswers}/${total}`,

accuracy,

date:
new Date().toLocaleDateString()

});


child.history =
child.history.slice(0,20);


saveLocal();

syncFirebase();


$("#result").innerHTML = `

/* =========================================================

========================================================= */

function addChild(){

const nameInput =
$("#newChildName");


const avatarInput =
$("#newChildAvatar");


const name =
nameInput.value.trim();


const avatar =
avatarInput.value;


if(!name){

toast(

state.language === "en"
?
"Please enter a Ninja name."
:
"Sila masukkan nama Ninja."

);

return;

}


const id =

name
.toLowerCase()
.replace(/[^a-z0-9]/g,"")

+

Date.now()
.toString()
.slice(-6);


children[id] = {

name,

avatar,

age:7,

xp:0,

stars:0,

streak:1,

totalQuestions:0,

correctAnswers:0,

topics:{

numbers:0,
addition:0,
subtraction:0,
fractions:0,
money:0,
time:0,
measurement:0,
shapes:0,
data:0

},

history:[]

};


state.currentChildId = id;


saveLocal();

syncFirebase();

renderAll();


toast(

state.language === "en"
?
"🥷 Ninja profile created!"
:
"🥷 Profil Ninja berjaya dibuat!"

);

/* =========================================================
   DELETE CHILD
========================================================= */

function deleteChild(id){

const child = children[id];


if(!child)
return;


if(Object.keys(children).length <= 1){

toast(

state.language === "en"
?
"At least one child profile is required."
:
"Sekurang-kurangnya satu profil anak diperlukan."

);

return;

}


const message =

state.language === "en"

?

`Delete ${child.name}'s profile?

All XP, stars, quiz history and learning progress for this child will be permanently removed.`

:

`Padam profil ${child.name}?

Semua XP, bintang, sejarah kuiz dan kemajuan pembelajaran anak ini akan dipadam.`;


if(!window.confirm(message))
return;


delete children[id];


if(state.currentChildId === id){

state.currentChildId =
Object.keys(children)[0];

}


saveLocal();

syncFirebase();

renderAll();


toast(

state.language === "en"
?
"Child profile deleted."
:
"Profil anak telah dipadam."

);

}

/* =========================================================
   FIREBASE SAVE
========================================================= */

async function syncFirebase(){

if(!auth.currentUser)
return;


try{

await set(

ref(

database,

`users/${auth.currentUser.uid}/ninjaMath`

),

{

children,

currentChildId:
state.currentChildId,

updatedAt:
Date.now()

}

);

}

catch(error){

console.log(
"Firebase sync error:",
error
);

}

}


/* =========================================================
   FIREBASE LOAD
========================================================= */

async function loadFirebase(user){

try{

const snapshot =
await get(

ref(

database,

`users/${user.uid}/ninjaMath`

)

);


if(snapshot.exists()){

const data =
snapshot.val();


if(
data.children
&&
Object.keys(data.children).length > 0
){

children =
data.children;

}


if(
data.currentChildId
&&
children[data.currentChildId]
){

state.currentChildId =
data.currentChildId;

}

else{

state.currentChildId =
Object.keys(children)[0];

}


saveLocal();

}

}

catch(error){

console.log(
"Firebase load error:",
error
);

}


renderAll();

}
