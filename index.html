<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#111111">

<title>Ninja Math</title>

<style>

:root{
    --black:#111111;
    --yellow:#FFD51E;
    --gold:#FFB800;
    --cream:#F8F6EE;
    --white:#FFFFFF;
    --green:#4CCB72;
    --red:#FF6868;
    --blue:#4A9EFF;
    --muted:#777777;
    --shadow:0 10px 30px rgba(0,0,0,.10);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#EAE8DF;
    font-family:
        "Arial Rounded MT Bold",
        "Trebuchet MS",
        Arial,
        sans-serif;
    color:#222;
}

button,
input,
select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    max-width:1100px;
    min-height:100vh;
    margin:auto;
    background:var(--cream);
    padding-bottom:105px;
}

/* ======================================================
START AUDIO SCREEN
====================================================== */

.start-overlay{
    position:fixed;
    inset:0;
    z-index:99999;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;

    background:
        radial-gradient(
            circle at top,
            #343434,
            #111 55%
        );

    color:white;
}

.start-overlay.hidden{
    display:none;
}

.start-box{
    width:min(470px,100%);
    text-align:center;
    padding:35px 25px;
    border-radius:32px;

    background:
        linear-gradient(
            145deg,
            #1B1B1B,
            #292929
        );

    border:3px solid #FFD51E;

    box-shadow:
        0 25px 70px rgba(0,0,0,.5);
}

.start-ninja{
    font-size:105px;
    line-height:1;
    margin-bottom:10px;
}

.start-box h1{
    margin:10px 0 5px;
    color:var(--yellow);
    font-size:38px;
}

.start-box p{
    margin:8px auto 24px;
    max-width:340px;
    color:#DDD;
    line-height:1.5;
}

.start-button{
    width:100%;
    padding:18px;
    border-radius:18px;

    background:var(--yellow);
    color:#111;

    font-weight:900;
    font-size:20px;

    box-shadow:0 7px 0 #B78D00;
}

.start-button:active{
    transform:translateY(4px);
    box-shadow:0 3px 0 #B78D00;
}

.start-audio-note{
    display:block;
    margin-top:15px;
    color:#999;
    font-size:11px;
}

/* ======================================================
TOP BAR
====================================================== */

.topbar{
    position:sticky;
    top:0;
    z-index:100;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;

    min-height:72px;
    padding:12px 18px;

    background:
        linear-gradient(
            135deg,
            #111,
            #292929
        );

    color:white;

    box-shadow:0 3px 15px rgba(0,0,0,.25);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:900;
}

.logo{
    width:47px;
    height:47px;

    display:grid;
    place-items:center;

    border-radius:15px;

    background:var(--yellow);

    font-size:28px;
}

.brand-title{
    font-size:18px;
}

.brand small{
    display:block;
    margin-top:2px;
    color:#BBB;
    font-size:10px;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:6px;
}

.pill{
    min-width:46px;
    min-height:42px;

    padding:8px 10px;

    border:1px solid #555;
    border-radius:999px;

    color:white;
    background:#333;

    font-size:14px;
}

.pill.active{
    background:var(--yellow);
    color:#111;
    border-color:var(--yellow);
}

/* ======================================================
GENERAL
====================================================== */

.screen{
    display:none;
    padding:18px;
}

.screen.active{
    display:block;
}

.card{
    background:white;

    border-radius:22px;

    padding:18px;

    box-shadow:var(--shadow);
}

.grid{
    display:grid;
    gap:14px;
}

.center{
    text-align:center;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;

    gap:10px;

    margin:23px 2px 12px;
}

.section-title h2{
    margin:0;
}

.section-title span{
    color:#777;
    font-size:12px;
}

.badge{
    display:inline-block;

    padding:6px 10px;

    border-radius:10px;

    background:#F0F0F0;

    font-size:11px;
    font-weight:900;
}

.btn{
    padding:14px 17px;

    border-radius:15px;

    background:var(--yellow);

    color:#111;

    font-weight:900;

    box-shadow:0 5px 0 #C49C00;
}

.btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #C49C00;
}

.btn.dark{
    background:#181818;
    color:white;
    box-shadow:0 5px 0 #000;
}

.btn.ghost{
    background:white;
    border:2px solid #DDD;
    box-shadow:none;
}

.btn.danger{
    background:#FFF0F0;
    color:#B91C1C;
    border:2px solid #FFD2D2;
    box-shadow:none;
}

.btn.small{
    padding:9px 12px;
    font-size:12px;
}

/* ======================================================
AVATARS
====================================================== */

.ninja-avatar{
    display:inline-flex;
    justify-content:center;
    align-items:center;

    flex-shrink:0;

    border-radius:50%;
    border:4px solid white;

    box-shadow:0 6px 16px rgba(0,0,0,.20);

    overflow:hidden;
}

.ninja-avatar.small{
    width:52px;
    height:52px;
    font-size:30px;
    border-width:3px;
}

.ninja-avatar.medium{
    width:78px;
    height:78px;
    font-size:45px;
}

.ninja-avatar.large{
    width:115px;
    height:115px;
    font-size:67px;
}

.avatar-red{
    background:linear-gradient(135deg,#FF7A7A,#C81823);
}

.avatar-pink{
    background:linear-gradient(135deg,#FFB1D5,#F04493);
}

.avatar-blue{
    background:linear-gradient(135deg,#8AD5FF,#2579D5);
}

.avatar-purple{
    background:linear-gradient(135deg,#D3A8FF,#7B3CC1);
}

.avatar-green{
    background:linear-gradient(135deg,#99E7A7,#2D9D4B);
}

.avatar-orange{
    background:linear-gradient(135deg,#FFD47D,#F0771C);
}

.avatar-cyan{
    background:linear-gradient(135deg,#A1F2F4,#24AEB7);
}

/* ======================================================
HOME
====================================================== */

.hero{
    display:grid;
    grid-template-columns:1.5fr .5fr;

    gap:18px;

    padding:25px;

    overflow:hidden;

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            #FFF8B8,
            #FFD51E
        );

    box-shadow:var(--shadow);
}

.hero h1{
    margin:9px 0;

    font-size:clamp(
        30px,
        6vw,
        48px
    );
}

.hero p{
    color:#615200;
}

.mascot{
    display:grid;
    place-items:center;
}

.stats{
    grid-template-columns:repeat(4,1fr);
    margin:18px 0;
}

.stat b{
    display:block;
    font-size:25px;
}

.stat span{
    color:#777;
    font-size:12px;
}

.progress{
    height:13px;
    border-radius:999px;
    overflow:hidden;
    background:#E8E8E8;
}

.progress i{
    display:block;
    height:100%;

    border-radius:999px;

    background:
        linear-gradient(
            90deg,
            var(--gold),
            var(--yellow)
        );
}

.mission{
    background:#181818;
    color:white;
}

.mission .progress{
    background:#3A3A3A;
}

/* ======================================================
AUDIO CARD
====================================================== */

.audio-card{
    margin-top:15px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #181818,
            #333
        );
}

.audio-card p{
    color:#CCC;
    font-size:13px;
}

.audio-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;

    margin-top:12px;
}

.audio-control{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;

    padding:12px;

    border-radius:15px;

    background:#3A3A3A;
}

.audio-status{
    padding:6px 9px;

    border-radius:999px;

    color:#DDD;
    background:#555;

    font-size:11px;
    font-weight:900;
}

.audio-status.on{
    color:#111;
    background:var(--yellow);
}

/* ======================================================
TOPICS
====================================================== */

.topics{
    grid-template-columns:repeat(3,1fr);
}

.topic{
    min-height:175px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.topic-icon{
    font-size:43px;
}

.topic h3{
    margin:8px 0 5px;
}

.topic p{
    margin:0;
    color:#777;
    font-size:12px;
    line-height:1.5;
}

.topic footer{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-top:15px;
}

/* ======================================================
DIFFICULTY
====================================================== */

.difficulty-header{
    max-width:800px;
    margin:auto;
    text-align:center;
}

.difficulty-icon{
    font-size:70px;
}

.difficulty-header h1{
    margin:5px 0;
}

.difficulty-header p{
    color:#777;
}

.difficulty-grid{
    max-width:850px;
    margin:18px auto;

    display:grid;
    gap:14px;
}

.difficulty-card{
    display:grid;

    grid-template-columns:65px 1fr auto;

    align-items:center;

    gap:15px;

    padding:18px;

    border:3px solid transparent;
    border-radius:22px;

    background:white;

    box-shadow:var(--shadow);

    transition:.15s;
}

.difficulty-card:hover{
    border-color:var(--yellow);
    transform:translateY(-2px);
}

.difficulty-number{
    width:58px;
    height:58px;

    display:grid;
    place-items:center;

    border-radius:18px;

    font-size:24px;
    font-weight:900;
}

.level1{background:#DFF7E7;}
.level2{background:#DDEEFF;}
.level3{background:#FFF1C4;}
.level4{background:#FFE1CA;}
.level5{background:#EDDEFF;}

/* ======================================================
PROFILE
====================================================== */

.profile-list{
    grid-template-columns:repeat(3,1fr);
}

.child-card{
    text-align:center;
    border:3px solid transparent;
}

.child-card.selected{
    border-color:var(--yellow);
    background:#FFFDF0;
}

.child-select{
    cursor:pointer;
}

.child-avatar{
    display:flex;
    justify-content:center;
}

.form-grid{
    grid-template-columns:1fr 1fr;
}

label{
    display:block;
    font-size:12px;
    font-weight:900;
    color:#555;
}

input,
select{
    width:100%;

    margin-top:6px;

    padding:13px;

    border-radius:14px;

    border:2px solid #DDD;

    background:white;
}

.avatar-title{
    margin:20px 0 10px;
    font-size:13px;
    font-weight:900;
}

.avatar-options{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
}

.avatar-option{
    padding:12px 5px;

    border-radius:18px;
    border:3px solid transparent;

    background:#F7F7F7;

    text-align:center;

    cursor:pointer;
}

.avatar-option.selected{
    background:#FFF9D7;
    border-color:var(--yellow);
}

.avatar-option span{
    display:block;

    margin-top:6px;

    font-size:10px;
    font-weight:900;
}

/* ======================================================
QUIZ
====================================================== */

.quiz-wrap{
    max-width:720px;
    margin:auto;
}

.quiz-head{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;
}

.quiz-level{
    padding:7px 10px;

    border-radius:999px;

    background:var(--yellow);

    font-size:11px;
    font-weight:900;
}

.question{
    padding:38px 10px 28px;

    text-align:center;

    font-size:clamp(
        27px,
        6vw,
        46px
    );

    font-weight:900;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.answer{
    min-height:80px;

    padding:12px;

    border:3px solid #EEE;
    border-radius:20px;

    background:white;

    font-size:23px;
    font-weight:900;
}

.answer:hover{
    border-color:var(--yellow);
}

.answer.correct{
    background:#DDF7E6;
    border-color:#47BB6B;
}

.answer.wrong{
    background:#FFE2E2;
    border-color:#FF6A6A;
}

.feedback{
    min-height:65px;

    margin-top:15px;

    padding:15px;

    text-align:center;

    border-radius:18px;

    font-weight:900;
}

.feedback.correct{
    background:#DDF7E6;
}

.feedback.wrong{
    background:#FFF0D7;
}

/* ======================================================
RESULT
====================================================== */

.result-score{
    font-size:70px;
    font-weight:900;
}

.result-stars{
    margin:10px 0;
    font-size:43px;
}

/* ======================================================
RANKING
====================================================== */

.ranking-hero{
    text-align:center;

    margin-bottom:14px;

    background:
        linear-gradient(
            135deg,
            #FFF5A4,
            #FFD51E
        );
}

.rank-row{
    display:grid;

    grid-template-columns:
        50px
        60px
        1fr
        auto;

    gap:10px;

    align-items:center;

    padding:13px 0;

    border-bottom:1px solid #EEE;
}

.rank-current{
    padding-left:8px;
    padding-right:8px;

    border-radius:15px;

    background:#FFF9D6;
}

.rank-number{
    width:40px;
    height:40px;

    display:grid;
    place-items:center;

    border-radius:50%;

    background:#EEE;

    font-weight:900;
}

/* ======================================================
PARENT
====================================================== */

.parent-selector{
    display:flex;
    align-items:center;
    gap:15px;

    padding:18px;

    margin-bottom:18px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            #181818,
            #303030
        );

    color:white;
}

.parent-selector-info{
    flex:1;
}

.parent-selector-info h3{
    margin:0 0 5px;
}

.parent-selector-info p{
    margin:0 0 9px;
    color:#CCC;
    font-size:12px;
}

.parent-selector select{
    max-width:300px;
    margin:0;
}

.performance-row{
    margin:14px 0;
}

.performance-row header{
    display:flex;
    justify-content:space-between;

    margin-bottom:5px;

    font-size:13px;
}

.parent-two{
    grid-template-columns:1fr 1fr;
}

.history-row{
    padding:12px 0;
    border-bottom:1px solid #EEE;
}

/* ======================================================
BOTTOM NAV
====================================================== */

.bottom-nav{
    position:fixed;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    z-index:1000;

    width:min(1100px,100%);

    display:grid;
    grid-template-columns:repeat(6,1fr);

    padding:
        7px
        5px
        calc(7px + env(safe-area-inset-bottom));

    background:white;

    border-top:1px solid #DDD;
}

.nav-btn{
    padding:8px 3px;

    border-radius:12px;

    background:transparent;

    color:#777;

    font-size:11px;
}

.nav-btn strong{
    display:block;
    font-size:21px;
}

.nav-btn.active{
    color:#111;
    background:#FFF4AD;
}

/* ======================================================
TOAST
====================================================== */

.toast{
    position:fixed;

    left:50%;
    bottom:105px;

    transform:translateX(-50%);

    z-index:9999;

    padding:12px 18px;

    border-radius:14px;

    background:#111;
    color:white;

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.toast.show{
    opacity:1;
}

/* ======================================================
MOBILE
====================================================== */

@media(max-width:800px){

    .avatar-options{
        grid-template-columns:repeat(4,1fr);
    }

}

@media(max-width:760px){

    .hero{
        grid-template-columns:1fr;
    }

    .mascot{
        display:none;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .topics{
        grid-template-columns:1fr 1fr;
    }

    .profile-list{
        grid-template-columns:1fr 1fr;
    }

    .difficulty-card{
        grid-template-columns:55px 1fr;
    }

    .difficulty-card .btn{
        grid-column:1/-1;
    }

    .nav-btn span{
        display:none;
    }

}

@media(max-width:520px){

    .avatar-options{
        grid-template-columns:repeat(2,1fr);
    }

    .audio-grid{
        grid-template-columns:1fr;
    }

    .parent-selector{
        flex-direction:column;
        text-align:center;
    }

    .parent-selector select{
        max-width:none;
    }

}

@media(max-width:430px){

    .screen{
        padding:14px;
    }

    .topics,
    .profile-list,
    .form-grid,
    .parent-two{
        grid-template-columns:1fr;
    }

    .answers{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<!-- ======================================================
AUDIO START OVERLAY

<div

        <div class="start-ninja">

<!-- ======================================================
APP

<div class="app">

        </div>

        <div>

<main>

    <section

    <section
    id="missions"
    class="screen">
    </section>

    <section
    id="ranking"
    class="screen">
    </section>

    <section
    id="profile"
    class="screen">
    </section>

    <section
    id="parent"

    </section>

    <section
    id="quiz"

    </section>

    <section

</main>

<nav class="bottom-nav">

    <button

    <button

    </button>

    <button
    class="nav-btn"
    data-page="missions">

        <strong>🎯</strong>
        <span>Missions</span>

    </button>

    <button
    class="nav-btn"
    data-page="ranking">

        <strong>🏆</strong>
        <span>Ranking</span>

    </button>

    <button
    class="nav-btn"
    data-page="profile">

        <strong>🥷</strong>
        <span>Profile</span>

    </button>

    <button
    class="nav-btn"
    data-page="parent">

        <strong>👨‍👩‍👧</strong>
        <span>Parent</span>

    </button>

</nav>

</div>

<div
id="toast"
class="toast">
</div>

/* ======================================================
AUDIO ENGINE
====================================================== */

let audioContext=null;

let masterGain=null;

let musicGain=null;

let sfxGain=null;

let musicInterval=null;

let musicStep=0;

let audioStarted=false;


/* ======================================================
INITIALIZE AUDIO
====================================================== */

async function initializeAudio(){

    if(!audioContext){

        const AudioContext=
        window.AudioContext
        ||
        window.webkitAudioContext;

        if(!AudioContext){

            alert(
                "This browser does not support Web Audio."
            );

            return false;

        }

        audioContext=
        new AudioContext();


        masterGain=
        audioContext.createGain();

        musicGain=
        audioContext.createGain();

        sfxGain=
        audioContext.createGain();


        masterGain.gain.value=
        0.85;


        /*
        IMPORTANT:
        music volume is intentionally
        much higher than previous version.
        */

        musicGain.gain.value=
        0.35;


        sfxGain.gain.value=
        0.45;


        musicGain.connect(
            masterGain
        );

        sfxGain.connect(
            masterGain
        );

        masterGain.connect(
            audioContext.destination
        );

    }


    if(
        audioContext.state
        ===
        "suspended"
    ){

        await audioContext.resume();

    }


    audioStarted=true;

    return true;

}


/* ======================================================
PLAY NOTE
====================================================== */

function playNote(
    frequency,
    duration,
    volume,
    oscillatorType="sine",
    delay=0,
    channel="sfx"
){

    if(
        !audioContext
        ||
        audioContext.state!=="running"
    ){

        return;

    }


    const now=
    audioContext.currentTime
    +
    delay;


    const oscillator=
    audioContext.createOscillator();


    const gain=
    audioContext.createGain();


    oscillator.type=
    oscillatorType;


    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );


    gain.gain.setValueAtTime(
        0.0001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        Math.max(
            volume,
            0.001
        ),
        now+0.015
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now+duration
    );


    oscillator.connect(
        gain
    );


    if(channel==="music"){

        gain.connect(
            musicGain
        );

    }
    else{

        gain.connect(
            sfxGain
        );

    }


    oscillator.start(
        now
    );


    oscillator.stop(
        now
        +
        duration
        +
        0.03
    );

}


/* ======================================================
NOISE / PERCUSSION
====================================================== */

function playDrum(
    volume=.05
){

    if(
        !audioContext
        ||
        audioContext.state!=="running"
    ){

        return;

    }


    const bufferSize=
    Math.floor(
        audioContext.sampleRate
        *
        0.04
    );


    const buffer=
    audioContext.createBuffer(
        1,
        bufferSize,
        audioContext.sampleRate
    );


    const data=
    buffer.getChannelData(0);


    for(
        let i=0;
        i<bufferSize;
        i++
    ){

        data[i]=
        (
            Math.random()*2-1
        )
        *
        (
            1-i/bufferSize
        );

    }


    const source=
    audioContext.createBufferSource();


    const gain=
    audioContext.createGain();


    source.buffer=
    buffer;


    gain.gain.value=
    volume;


    source.connect(
        gain
    );


    gain.connect(
        musicGain
    );


    source.start();

}

function playMusicStep(){

    if(
        !state.music
        ||
        !audioStarted
        ||
        !audioContext
        ||
        audioContext.state!=="running"
    ){

        return;

    }


    const note=

    ninjaMelody[
        musicStep
        %
        ninjaMelody.length
    ];


    const bass=

    ninjaBass[
        Math.floor(
            musicStep/2
        )
        %
        ninjaBass.length
    ];


    /*
    Main melody
    */

    playNote(

        note,

        .27,

        .22,

        "triangle",

        0,

        "music"

    );


    /*
    Small harmony
    */

    if(
        musicStep%4===0
    ){

        playNote(

            note/2,

            .35,

            .09,

            "sine",

            0,

            "music"

        );

    }


    /*
    Bass
    */

    if(
        musicStep%2===0
    ){

        playNote(

            bass,

            .34,

            .16,

            "sine",

            0,

            "music"

        );

    }


    /*
    Percussion
    */

    playDrum(
        musicStep%4===0
        ?
        .12
        :
        .055
    );


    musicStep++;

}


/* ======================================================
START MUSIC
====================================================== */

function startBackgroundMusic(){

    if(
        !state.music
        ||
        !audioStarted
        ||
        !audioContext
    ){

        return;

    }


    stopBackgroundMusic();


    /*
    Play immediately.
    */

    playMusicStep();


    /*
    Then continue looping.
    */

    musicInterval=
    setInterval(
        playMusicStep,
        390
    );

}


/* ======================================================
STOP MUSIC
====================================================== */

function stopBackgroundMusic(){

    if(musicInterval){

        clearInterval(
            musicInterval
        );

        musicInterval=null;

    }

}


/* ======================================================
SFX
====================================================== */

function playSFX(type){

    if(
        !state.sfx
        ||
        !audioStarted
        ||
        !audioContext
        ||
        audioContext.state!=="running"
    ){

        return;

    }


    switch(type){

                0
            );

            playNote(
                523,
                .13,
                .20,
                "triangle",
                .10
            );

            playNote(
                659,
                .18,
                .22,
                "triangle",
                .20
            );

            break;


        case "correct":

            playNote(
                523,
                .12,
                .22,
                "sine",
                0
            );

            playNote(
                659,
                .12,
                .23,
                "sine",
                .09
            );

            playNote(
                784,
                .20,
                .25,
                "sine",
                .18
            );

            break;


        case "wrong":

            playNote(
                300,
                .16,
                .16,
                "triangle",
                0
            );

            playNote(
                220,
                .22,
                .14,
                "triangle",
                .12
            );

            break;


        case "complete":

            playNote(
                523,
                .14,
                .23,
                "triangle",
                0
            );

            playNote(
                659,
                .14,
                .24,
                "triangle",
                .12
            );

            playNote(
                784,
                .14,
                .25,
                "triangle",
                .24
            );

            playNote(
                1046,
                .35,
                .27,
                "triangle",
                .36
            );

            break;


        case "delete":

            playNote(
                260,
                .12,
                .15,
                "triangle"
            );

            playNote(
                180,
                .20,
                .13,
                "triangle",
                .1
            );

            break;

    }

}

async function startApplication(){

    const success=
    await initializeAudio();


    if(!success){

        return;

    }


    $("#startOverlay")
    .classList.add(
        "hidden"
    );


    /*
    This explicit user click
    is the important part.

    Music starts directly
    from this interaction.
    */

    if(state.music){

        startBackgroundMusic();

    }


    playSFX(
        "start"
    );


    toast(
        "🥷 Welcome to Ninja Math!"
    );

}

/* ======================================================
PAUSE WHEN TAB HIDDEN
====================================================== */

document.addEventListener(
"visibilitychange",
()=>{

    if(
        document.hidden
    ){

        stopBackgroundMusic();

    }
    else{

        if(
            state.music
            &&
            audioStarted
        ){

            if(
                audioContext?.state
                ===
                "suspended"
            ){

                audioContext
                .resume()
                .then(
                    startBackgroundMusic
                );

            }
            else{

                startBackgroundMusic();

            }

        }

    }

}
);


/* ======================================================
GLOBAL CLICK SFX
====================================================== */

document.addEventListener(
"click",
event=>{

    if(
        !audioStarted
    ){

        return;

    }


    const button=
    event.target.closest(
        "button"
    );


    if(
        button
        &&
        !button.classList.contains(
            "answer"
        )
        &&
        button.id!=="startAppButton"
    ){

        playSFX(
            "tap"
        );

    }

}
);

    Math.min(
        10,
        Math.floor(

        )
        +
        1
    );


    return{

        level,

        name:
        ninjaLevels[
            level-1
        ]

    };

    if(accuracy>=90){
        return 3;
    }

    if(accuracy>=70){
        return 2;
    }

    return 1;

}

/* ======================================================
QUESTION HELPERS
====================================================== */

function randomNumber(
    min,
    max
){

    return(
        Math.floor(
            Math.random()
            *
            (
                max-min+1
            )
        )
        +
        min
    );

}


function shuffle(array){

    const result=
    [...array];


    for(
        let i=
        result.length-1;

        i>0;

        i--
    ){

        const j=
        Math.floor(
            Math.random()
            *
            (i+1)
        );


        [
            result[i],
            result[j]
        ]
        =
        [
            result[j],
            result[i]
        ];

    }


    return result;

}


function makeQuestion(
    question,
    answer,
    options
){

    let clean=

    [
        ...new Set(
            options.map(String)
        )
    ];


    while(
        clean.length<4
    ){

        const numeric=
        Number(answer);


        if(
            Number.isFinite(
                numeric
            )
        ){

            const next=
            String(
                numeric
                +
                clean.length
                +
                1
            );


            if(
                !clean.includes(
                    next
                )
            ){

                clean.push(
                    next
                );

            }

        }
        else{

            const fallback=[

                "None",
                "Same",
                "Both",
                "Not sure"

            ].find(
            x=>
            !clean.includes(x)
            );


            clean.push(
                fallback
                ||
                `Option ${
                    clean.length+1
                }`
            );

        }

    }


    return{

        question,

        answer:
        String(answer),

        options:
        shuffle(
            clean.slice(0,4)
        )

    };

}


/* ======================================================
ADDITION
====================================================== */

function additionQuestion(level){

    let a,b,c,answer;


    if(level===1){

        a=randomNumber(0,5);

        b=randomNumber(0,5);

        answer=a+b;

        return makeQuestion(

            `${a} + ${b} = ?`,

            answer,

            [
                answer,
                answer+1,
                Math.max(
                    0,
                    answer-1
                ),
                answer+2
            ]

        );

    }


    if(level===2){

        a=randomNumber(2,10);

        b=randomNumber(2,10);

        answer=a+b;

        return makeQuestion(

            `${a} + ${b} = ?`,

            answer,

            [
                answer,
                answer+1,
                answer+2,
                Math.max(
                    0,
                    answer-2
                )
            ]

        );

    }


    if(level===3){

        a=randomNumber(10,30);

        b=randomNumber(5,20);

        answer=a+b;

        return makeQuestion(

            `${a} + ${b} = ?`,

            answer,

            [
                answer,
                answer+10,
                answer+2,
                answer-5
            ]

        );

    }


    if(level===4){

        a=randomNumber(20,60);

        b=randomNumber(10,40);

        answer=a+b;

        return makeQuestion(

            `Ali has ${a} stickers and gets ${b} more. How many stickers now?`,

            answer,

            [
                answer,
                answer+5,
                answer-5,
                answer+10
            ]

        );

    }


    a=randomNumber(30,70);

    b=randomNumber(20,50);

    c=randomNumber(5,20);

    answer=a+b+c;


    return makeQuestion(

        `${a} + ${b} + ${c} = ?`,

        answer,

        [
            answer,
            answer+5,
            answer-5,
            answer+10
        ]

    );

}


/* ======================================================
SUBTRACTION
====================================================== */

function subtractionQuestion(level){

    let a,b,c,answer;


    if(level===1){

        a=randomNumber(2,10);

        b=randomNumber(0,a);

        answer=a-b;

    }

    else if(level===2){

        a=randomNumber(10,20);

        b=randomNumber(1,10);

        answer=a-b;

    }

    else if(level===3){

        a=randomNumber(20,50);

        b=randomNumber(
            5,
            a-5
        );

        answer=a-b;

    }

    else if(level===4){

        a=randomNumber(40,80);

        b=randomNumber(10,35);

        answer=a-b;


        return makeQuestion(

            `Sara has ${a} marbles and gives away ${b}. How many are left?`,

            answer,

            [
                answer,
                answer+5,
                answer-5,
                answer+10
            ]

        );

    }

    else{

        a=randomNumber(70,100);

        b=randomNumber(20,40);

        c=randomNumber(5,15);

        answer=
        a-b-c;


        return makeQuestion(

            `${a} − ${b} − ${c} = ?`,

            answer,

            [
                answer,
                answer+10,
                answer-10,
                answer+5
            ]

        );

    }


    return makeQuestion(

        `${a} − ${b} = ?`,

        answer,

        [
            answer,
            answer+2,
            Math.max(
                0,
                answer-2
            ),
            answer+1
        ]

    );

}


/* ======================================================
NUMBERS
====================================================== */

function numbersQuestion(level){

    if(level===1){

        const n=
        randomNumber(0,9);


        return makeQuestion(

            `What number comes after ${n}?`,

            n+1,

            [
                n,
                n+1,
                n+2,
                Math.max(
                    0,
                    n-1
                )
            ]

        );

    }


    if(level===2){

        const a=
        randomNumber(1,20);


        let b=
        randomNumber(1,20);


        while(a===b){

            b=
            randomNumber(1,20);

        }


        return{

            question:
            `Which is greater: ${a} or ${b}?`,

            answer:
            String(
                Math.max(a,b)
            ),

            options:
            shuffle(
                [
                    String(a),
                    String(b)
                ]
            )

        };

    }


    if(level===3){

        const n=
        randomNumber(5,40);


        return makeQuestion(

            `${n}, ${n+2}, ${n+4}, __, ${n+8}`,

            n+6,

            [
                n+5,
                n+6,
                n+7,
                n+8
            ]

        );

    }


    if(level===4){

        const tens=
        randomNumber(2,8);


        const ones=
        randomNumber(1,9);


        const number=
        tens*10+ones;


        return makeQuestion(

            `What is the place value of ${tens} in ${number}?`,

            tens*10,

            [
                tens,
                tens*10,
                ones,
                number
            ]

        );

    }


    let nums=[

        randomNumber(20,99),

        randomNumber(20,99),

        randomNumber(20,99)

    ];


    while(
        new Set(nums).size<3
    ){

        nums=[

            randomNumber(20,99),

            randomNumber(20,99),

            randomNumber(20,99)

        ];

    }


    const answer=
    Math.max(...nums);


    return makeQuestion(

        `Which is largest: ${nums.join(", ")}?`,

        answer,

        [
            ...nums,
            Math.max(
                0,
                Math.min(...nums)-1
            )
        ]

    );

}

        ],

        5:[
            [
                "Mon:3 books, Tue:5, Wed:4. Total?",
                12,
                [
                    10,
                    11,
                    12,
                    13
                ]
            ]
        ]

    }

    };


    const list=
    banks[topic]?.[level];


    if(
        !list
        ||
        !list.length
    ){

        return makeQuestion(

            "1 + 1 = ?",

            2,

            [1,2,3,4]

        );

    }


    const item=
    list[
        randomNumber(
            0,
            list.length-1
        )
    ];


    return makeQuestion(

        item[0],

        item[1],

        item[2]

    );

}


/* ======================================================
GENERATE QUESTION
====================================================== */

function generateQuestion(
    topic,
    level
){

    switch(topic){

        case "addition":

            return additionQuestion(
                level
            );


        case "subtraction":

            return subtractionQuestion(
                level
            );


        case "numbers":

            return numbersQuestion(
                level
            );


        case "fractions":

            return fractionsQuestion(
                level
            );


        case "money":

            return moneyQuestion(
                level
            );


        case "time":

        case "measurement":

        case "shapes":

        case "data":

            return bankQuestion(
                topic,
                level
            );


        default:

            return makeQuestion(
                "1 + 1 = ?",
                2,
                [1,2,3,4]
            );

    }

}


/* ======================================================
START QUIZ
====================================================== */

function startQuiz(
    topic,
    level
){

    state.currentTopic=
    topic;


    state.difficulty=
    Number(level);


    state.questions=[];

    state.questionIndex=0;

    state.correctAnswers=0;

    state.answerLocked=false;


    for(
        let i=0;
        i<15;
        i++
    ){

        state.questions.push(

            generateQuestion(
                topic,
                level
            )

        );

    }


    showPage(
        "quiz"
    );


    renderQuestion();

}

====================================================== */

/* ======================================================
ANSWER
====================================================== */

function answerQuestion(button){

    if(
        state.answerLocked
    ){

        return;

    }


    state.answerLocked=
    true;


    const q=
    state.questions[
        state.questionIndex
    ];


    const selected=
    button.dataset.answer;


    const correct=

    String(selected)
    ===
    String(q.answer);


    const feedback=
    $("#feedback");


    if(correct){

        state.correctAnswers++;


        button
        .classList
        .add(
            "correct"
        );


        feedback.className=
        "feedback correct";


        feedback.textContent=
        t("correct");


        playSFX(
            "correct"
        );

    }
    else{

        button
        .classList
        .add(
            "wrong"
        );


        document
        .querySelectorAll(
            ".answer"
        )
        .forEach(
        answerButton=>{

            if(

                String(
                    answerButton.dataset.answer
                )

                ===

                String(
                    q.answer
                )

            ){

                answerButton
                .classList
                .add(
                    "correct"
                );

            }

        }
        );


        feedback.className=
        "feedback wrong";


        feedback.innerHTML=`

            ${t("wrong")}

            <br>

            Correct answer:

            <strong>
                ${q.answer}
            </strong>

        `;


        playSFX(
            "wrong"
        );

    }


    setTimeout(
    ()=>{

        state.questionIndex++;

        state.answerLocked=
        false;

        renderQuestion();

    },
    1150
    );

}


/* ======================================================
FINISH QUIZ
====================================================== */

function finishQuiz(){

    const child=
    currentChild();


    const total=
    state.questions.length;


    const accuracy=

    Math.round(

        state.correctAnswers

        /

        total

        *

        100

    );


    let xpEarned=

    state.correctAnswers
    *
    10

    +

    state.difficulty
    *
    10;


    if(
        accuracy===100
    ){

        xpEarned+=100;

    }


    const starsEarned=
    getStars(
        accuracy
    );


    child.xp=
    (child.xp||0)
    +
    xpEarned;


    child.stars=
    (child.stars||0)
    +
    starsEarned;


    child.totalQuestions=
    (child.totalQuestions||0)
    +
    total;


    child.correctAnswers=
    (child.correctAnswers||0)
    +
    state.correctAnswers;


    child.topics ||= {};


    const oldScore=

    child.topics[
        state.currentTopic
    ]
    ||
    0;


    child.topics[
        state.currentTopic
    ]
    =
    oldScore===0

    ?

    accuracy

    :

    Math.round(
        (
            oldScore
            +
            accuracy
        )
        /
        2
    );


    child.history ||= [];


    child.history.unshift({

        topic:
        state.currentTopic,

        difficulty:
        state.difficulty,

        score:
        `${state.correctAnswers}/${total}`,

        accuracy,

        date:
        new Date()
        .toLocaleDateString()

    });


    child.history=
    child.history.slice(
        0,
        30
    );


    saveLocal();

    syncFirebase();


    $("#result")
    .innerHTML=`

    <div class="
        quiz-wrap
        center
    ">

            child.avatarId,

        <div class="result-score">

            ${state.correctAnswers}/${total}

        </div>


        <div class="result-stars">

            ${
                "⭐".repeat(
                    starsEarned
                )
            }

        </div>


        <div class="grid stats">

            <div class="card stat">

                <b>
                    ${accuracy}%
                </b>

                <span>
                    Accuracy
                </span>

            </div>


            <div class="card stat">

                <b>
                    +${xpEarned}
                </b>

                <span>
                    XP
                </span>

            </div>


            <div class="card stat">

                <b>
                    +${starsEarned}
                </b>

                <span>
                    Stars
                </span>

            </div>


            <div class="card stat">

                <b>
                    ${state.difficulty}
                </b>

                <span>
                    Level
                </span>

            </div>

        </div>


        <button
        class="btn"
        onclick="
            startQuiz(
                '${state.currentTopic}',
                ${state.difficulty}
            )
        ">

            ${t("tryAgain")}

        </button>


        <button
        class="btn ghost"

        </button>


        <button
        class="btn dark"
        onclick="
            showPage(
                'learn'
            )
        ">

            📚 Learn

        </button>

    </div>

    `;


    showPage(

    );


    setTimeout(

    );

}

/* ======================================================

====================================================== */

function addChild(){

    const name=
    $("#newChildName")
    .value
    .trim();


    const age=
    Number(
        $("#newChildAge")
        .value
    );


    if(!name){

        toast(
            "Please enter the child's name."
        );

        return;

    }


    if(
        !age
        ||
        age<7
        ||
        age>12
    ){

        toast(
            "Please select age between 7 and 12."
        );

        return;

    }


    const id=

    (
        name
        .toLowerCase()
        .replace(
            /[^a-z0-9]/g,
            ""
        )

        ||

        "ninja"
    )

    +

    Date.now()
    .toString()
    .slice(-6);


    children[id]={

        name,

        age,

        avatarId:
        state.newAvatar,

        xp:0,

        stars:0,

        streak:1,

        totalQuestions:0,

        correctAnswers:0,

        topics:{

            numbers:0,
            addition:0,
            subtraction:0,
            fractions:0,
            money:0,
            time:0,
            measurement:0,
            shapes:0,
            data:0

        },

        history:[]

    };


    state.currentChildId=
    id;


    state.parentChildId=
    id;


    state.newAvatar=
    "redBoy";


    saveLocal();

    syncFirebase();

    renderAll();


    playSFX(
        "complete"
    );


    toast(
        "🥷 Ninja profile created!"
    );

}


/* ======================================================
DELETE CHILD
====================================================== */

function deleteChild(id){

    if(
        !children[id]
    ){

        return;

    }


    if(
        Object.keys(
            children
        ).length<=1
    ){

        toast(
            "At least one child profile is required."
        );

        return;

    }


    const child=
    children[id];


    const confirmed=
    confirm(

        `Delete ${child.name}'s profile?\n\nAll XP, stars, history and learning progress will be permanently removed.`

    );


    if(
        !confirmed
    ){

        return;

    }


    delete children[id];


    const first=
    Object.keys(children)[0];


    if(
        state.currentChildId
        ===
        id
    ){

        state.currentChildId=
        first;

    }


    if(
        state.parentChildId
        ===
        id
    ){

        state.parentChildId=
        state.currentChildId;

    }


    saveLocal();

    syncFirebase();

    renderAll();


    playSFX(
        "delete"
    );


    toast(
        "Child profile deleted."
    );

}

            <div class="audio-control">

                <span>
                    🎵 ${t("music")}
                </span>

                <button
                class="btn small"
                onclick="toggleMusic()">

                    ${state.music ? "ON":"OFF"}

                </button>

            </div>


            <div class="audio-control">

                <span>
                    🔊 ${t("soundEffects")}
                </span>

                <button
                class="btn small"
                onclick="toggleSFX()">

                    ${state.sfx ? "ON":"OFF"}

                </button>

            </div>

        </div>

    </div>

    `;

}


/* ======================================================
LANGUAGE
====================================================== */

function toggleLanguage(){

    state.language=

    state.language
    ===
    "en"

    ?

    "bm"

    :

    "en";


    saveLocal();

    renderAll();


    playSFX(
        "select"
    );

}


/* ======================================================
FIREBASE SAVE
====================================================== */

async function syncFirebase(){

    if(
        !auth.currentUser
    ){

        return;

    }


    try{

        await set(

            ref(
                database,
                `users/${auth.currentUser.uid}/ninjaMath`
            ),

            {

                children,

                currentChildId:
                state.currentChildId,

                parentChildId:
                state.parentChildId,

                settings:{

                    language:
                    state.language,

                    music:
                    state.music,

                    sfx:
                    state.sfx

                },

                updatedAt:
                Date.now()

            }

        );

    }
    catch(error){

        console.log(
            "Firebase sync error:",
            error
        );

    }

}


/* ======================================================
FIREBASE LOAD
====================================================== */

async function loadFirebase(user){

    try{

        const snapshot=
        await get(

            ref(
                database,
                `users/${user.uid}/ninjaMath`
            )

        );


        if(
            snapshot.exists()
        ){

            const data=
            snapshot.val();


            if(
                data.children
                &&
                Object.keys(
                    data.children
                ).length
            ){

                children=
                data.children;

            }


            Object
            .values(children)
            .forEach(
            (child,index)=>{

                if(
                    !child.avatarId
                ){

                    child.avatarId=

                    index%2===0

                    ?

                    "redBoy"

                    :

                    "pinkGirl";

                }


                if(
                    !child.age
                ){

                    child.age=7;

                }

            }
            );


            if(
                data.currentChildId
                &&
                children[
                    data.currentChildId
                ]
            ){

                state.currentChildId=
                data.currentChildId;

            }


            if(
                data.parentChildId
                &&
                children[
                    data.parentChildId
                ]
            ){

                state.parentChildId=
                data.parentChildId;

            }
            else{

                state.parentChildId=
                state.currentChildId;

            }


            /*
            Keep the latest LOCAL audio
            preference because audio may
            already have been activated
            before Firebase finishes loading.
            */

            if(
                data.settings?.language
            ){

                state.language=
                data.settings.language;

            }


            saveLocal();

        }

    }
    catch(error){

        console.log(
            "Firebase load error:",
            error
        );

    }


    renderAll();

}


/* ======================================================
RENDER ALL
====================================================== */

function renderAll(){

    if(
        !children[
            state.currentChildId
        ]
    ){

        state.currentChildId=
        Object.keys(children)[0];

    }


    if(
        !children[
            state.parentChildId
        ]
    ){

        state.parentChildId=
        state.currentChildId;

    }


    renderHeader();

    renderHome();

    renderLearn();

    renderDifficulty();

    renderMissions();

    renderRanking();

    renderProfile();

    renderParent();

}
