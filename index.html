<script>
function renderProfile(){
  $("#profile").innerHTML=`
    <div class="section-title">
      <h2>🥷 ${tr("select")}</h2>
      <span>Multi-child</span>
    </div>

    <div class="profile-list">
      ${Object.entries(children).map(([id,c])=>`
        <div class="card child ${id===state.currentChildId?"selected":""}">

          <div onclick="selectChild('${id}')" style="cursor:pointer">
            <div class="avatar">${c.avatar}</div>

            <h3>${c.name}</h3>

            <p>
              ${c.xp} XP • ⭐ ${c.stars}
            </p>
          </div>

          <button
            class="btn small ghost"
            style="
              margin-top:10px;
              width:100%;
              color:#c62828;
              border-color:#ffd0d0;
            "
            onclick="deleteChild('${id}')"
          >
            🗑️ ${state.lang==="en" ? "Delete Profile" : "Padam Profil"}
          </button>

        </div>
      `).join("")}
    </div>

    <div class="section-title">
      <h2>➕ ${tr("addChild")}</h2>
    </div>

    <div class="card">

      <div class="form-row">

        <div>
          <label>
            Ninja Name

            <input
              id="newName"
              placeholder="e.g. Danish"
            >

          </label>
        </div>

        <div>

          <label>
            Avatar

            <select id="newAvatar">
              <option>🥷</option>
              <option>👦</option>
              <option>👧</option>
              <option>🐼</option>
              <option>🐱</option>
              <option>🤖</option>
            </select>

          </label>

        </div>

      </div>

      <button
        class="btn"
        style="margin-top:14px"
        onclick="addChild()"
      >
        ${tr("save")}
      </button>

    </div>
  `;
}
</script>
