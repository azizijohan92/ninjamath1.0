<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111111">

<title>Ninja Math</title>

<style>
:root{
  --black:#111;
  --yellow:#FFD51E;
  --gold:#FFB800;
  --bg:#F7F5ED;
  --green:#50C878;
  --red:#FF6B6B;
  --muted:#777;
  --shadow:0 10px 28px rgba(0,0,0,.10);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:#222;
  font-family:"Arial Rounded MT Bold",Arial,sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  max-width:1100px;
  min-height:100vh;
  margin:auto;
  background:#FAF9F3;
  padding-bottom:105px;
}

/* TOP BAR */

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:14px 18px;
  color:white;
  background:linear-gradient(135deg,#101010,#292929);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
}

.logo{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:var(--yellow);
  color:#111;
  font-size:27px;
}

.brand small{
  display:block;
  margin-top:2px;
  color:#ccc;
  font-size:10px;
}

.header-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.pill{
  min-width:45px;
  padding:9px 10px;
  color:white;
  background:#333;
  border:1px solid #555;
  border-radius:999px;
  font-size:13px;
}

.pill.active{
  color:#111;
  background:var(--yellow);
  border-color:var(--yellow);
}

/* GENERAL */

.screen{
  display:none;
  padding:18px;
}

.screen.active{
  display:block;
}

.card{
  padding:18px;
  background:white;
  border-radius:22px;
  box-shadow:var(--shadow);
}

.grid{
  display:grid;
  gap:14px;
}

.btn{
  padding:14px 18px;
  border-radius:15px;
  background:var(--yellow);
  color:#111;
  font-weight:900;
  box-shadow:0 5px 0 #C79E00;
}

.btn:hover{
  filter:brightness(1.02);
}

.btn:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #C79E00;
}

.btn.dark{
  color:white;
  background:#171717;
  box-shadow:0 5px 0 #000;
}

.btn.ghost{
  background:white;
  border:2px solid #ddd;
  box-shadow:none;
}

.btn.danger{
  color:#B91C1C;
  background:#FFF2F2;
  border:2px solid #FFD0D0;
  box-shadow:none;
}

.btn.small{
  padding:9px 12px;
  font-size:13px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:10px;
  margin:22px 2px 12px;
}

.section-title h2{
  margin:0;
}

.section-title span{
  color:var(--muted);
  font-size:12px;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:10px;
  background:#F1F1F1;
  font-size:11px;
  font-weight:900;
}

.center{text-align:center}

/* HERO */

.hero{
  display:grid;
  grid-template-columns:1.5fr .5fr;
  gap:20px;
  padding:24px;
  overflow:hidden;
  border-radius:30px;
  background:linear-gradient(135deg,#FFF7B2,#FFE138);
  box-shadow:var(--shadow);
}

.hero h1{
  margin:8px 0;
  font-size:clamp(30px,6vw,48px);
}

.hero p{
  color:#594B00;
}

.mascot{
  display:grid;
  place-items:center;
}

/* NINJA AVATAR */

.ninja-avatar{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  border:4px solid white;
  border-radius:50%;
  box-shadow:0 5px 15px rgba(0,0,0,.18);
  overflow:hidden;
}

.ninja-face{
  font-size:inherit;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.15));
}

.ninja-avatar.small{
  width:52px;
  height:52px;
  font-size:30px;
  border-width:3px;
}

.ninja-avatar.medium{
  width:76px;
  height:76px;
  font-size:44px;
}

.ninja-avatar.large{
  width:112px;
  height:112px;
  font-size:66px;
}

.avatar-red{
  background:linear-gradient(135deg,#FF7777,#C71924);
}

.avatar-pink{
  background:linear-gradient(135deg,#FFB0D4,#F43E93);
}

.avatar-blue{
  background:linear-gradient(135deg,#7ACFFF,#2379D8);
}

.avatar-purple{
  background:linear-gradient(135deg,#D0A3FF,#7D3EC5);
}

.avatar-green{
  background:linear-gradient(135deg,#92E7A3,#279D4C);
}

.avatar-orange{
  background:linear-gradient(135deg,#FFD37C,#F0781D);
}

.avatar-cyan{
  background:linear-gradient(135deg,#A5F3F5,#20AEB7);
}

/* STATS */

.stats{
  grid-template-columns:repeat(4,1fr);
  margin:18px 0;
}

.stat b{
  display:block;
  font-size:25px;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

.progress{
  height:13px;
  overflow:hidden;
  border-radius:999px;
  background:#EAEAEA;
}

.progress i{
  display:block;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--gold),var(--yellow));
}

.mission{
  color:white;
  background:#181818;
}

.mission .progress{
  background:#393939;
}

/* TOPICS */

.topics{
  grid-template-columns:repeat(3,1fr);
}

.topic{
  min-height:175px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.topic-icon{
  font-size:42px;
}

.topic h3{
  margin:8px 0 4px;
}

.topic p{
  margin:0;
  color:#777;
  font-size:12px;
  line-height:1.5;
}

.topic footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:15px;
}

/* DIFFICULTY */

.difficulty-header{
  max-width:800px;
  margin:auto;
  text-align:center;
  padding:10px 0 18px;
}

.difficulty-topic-icon{
  font-size:70px;
}

.difficulty-header h1{
  margin:6px 0;
}

.difficulty-header p{
  color:#777;
}

.difficulty-grid{
  max-width:850px;
  margin:auto;
  display:grid;
  gap:14px;
}

.difficulty-card{
  display:grid;
  grid-template-columns:65px 1fr auto;
  gap:15px;
  align-items:center;
  padding:18px;
  border:3px solid transparent;
  border-radius:22px;
  background:white;
  box-shadow:var(--shadow);
  transition:.15s;
}

.difficulty-card:hover{
  transform:translateY(-2px);
  border-color:var(--yellow);
}

.difficulty-number{
  width:58px;
  height:58px;
  display:grid;
  place-items:center;
  border-radius:18px;
  font-size:24px;
  font-weight:900;
}

.level-1 .difficulty-number{background:#E0F8E7}
.level-2 .difficulty-number{background:#DDEFFF}
.level-3 .difficulty-number{background:#FFF1C8}
.level-4 .difficulty-number{background:#FFE0CC}
.level-5 .difficulty-number{background:#F1E2FF}

.difficulty-info h3{
  margin:0 0 5px;
}

.difficulty-info p{
  margin:0;
  color:#777;
  font-size:13px;
}

.difficulty-stars{
  margin-top:7px;
}

/* PROFILE */

.profile-list{
  grid-template-columns:repeat(3,1fr);
}

.child-card{
  text-align:center;
  border:3px solid transparent;
}

.child-card.selected{
  border-color:var(--yellow);
  background:#FFFDF1;
}

.child-select{
  cursor:pointer;
}

.child-avatar{
  display:flex;
  justify-content:center;
  margin-bottom:10px;
}

.delete-profile{
  width:100%;
  margin-top:10px;
}

.form-grid{
  grid-template-columns:1fr 1fr;
}

label{
  display:block;
  color:#555;
  font-size:12px;
  font-weight:900;
}

input,
select{
  width:100%;
  padding:13px;
  margin-top:6px;
  border:2px solid #ddd;
  border-radius:14px;
  background:white;
}

.avatar-title{
  margin:20px 0 10px;
  font-size:13px;
  font-weight:900;
}

.avatar-options{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
}

.avatar-option{
  padding:12px 5px;
  text-align:center;
  border:3px solid transparent;
  border-radius:18px;
  background:#F8F8F8;
  cursor:pointer;
  transition:.15s;
}

.avatar-option:hover{
  transform:translateY(-2px);
}

.avatar-option.selected{
  border-color:var(--yellow);
  background:#FFF9D7;
}

.avatar-option span{
  display:block;
  margin-top:6px;
  font-size:10px;
  font-weight:900;
}

.avatar-option .ninja-avatar{
  margin:auto;
}

/* QUIZ */

.quiz-wrap{
  max-width:720px;
  margin:auto;
}

.quiz-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.quiz-level{
  padding:7px 10px;
  border-radius:999px;
  background:var(--yellow);
  font-size:11px;
  font-weight:900;
}

.question{
  padding:38px 10px 28px;
  text-align:center;
  font-size:clamp(27px,6vw,46px);
  font-weight:900;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.answer{
  min-height:80px;
  padding:12px;
  border:3px solid #eee;
  border-radius:20px;
  background:white;
  font-size:24px;
  font-weight:900;
  transition:.15s;
}

.answer:hover{
  transform:scale(1.02);
  border-color:#FFD51E;
}

.answer.correct{
  border-color:#42B96D;
  background:#DBF7E5;
  transform:scale(1.03);
}

.answer.wrong{
  border-color:#FF7070;
  background:#FFE1E1;
}

.feedback{
  min-height:65px;
  margin-top:16px;
  padding:15px;
  text-align:center;
  border-radius:18px;
  font-weight:900;
}

.feedback.correct{
  background:#DDF7E6;
}

.feedback.wrong{
  background:#FFF0D8;
}

/* RESULT */

.result-avatar{
  display:flex;
  justify-content:center;
  margin-bottom:15px;
}

.result-score{
  font-size:70px;
  font-weight:900;
}

.result-stars{
  margin:10px 0;
  font-size:45px;
}

/* RANKING */

.ranking-top-card{
  margin-bottom:14px;
  text-align:center;
  background:linear-gradient(135deg,#FFF5A0,#FFD51E);
}

.ranking-top-card .trophy{
  font-size:55px;
}

.rank-row{
  display:grid;
  grid-template-columns:50px 60px 1fr auto;
  gap:10px;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.rank-position{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#F1F1F1;
  font-weight:900;
}

.rank-current{
  padding-left:8px;
  padding-right:8px;
  border-radius:16px;
  background:#FFF9D7;
}

/* PARENT */

.parent-selector{
  display:flex;
  align-items:center;
  gap:15px;
  padding:18px;
  margin-bottom:18px;
  background:linear-gradient(135deg,#181818,#292929);
  color:white;
  border-radius:22px;
  box-shadow:var(--shadow);
}

.parent-selector-avatar{
  flex-shrink:0;
}

.parent-selector-info{
  flex:1;
}

.parent-selector-info h3{
  margin:0 0 4px;
}

.parent-selector-info p{
  margin:0 0 8px;
  color:#ccc;
  font-size:12px;
}

.parent-selector select{
  max-width:280px;
  margin:0;
}

.performance-row{
  margin:14px 0;
}

.performance-row header{
  display:flex;
  justify-content:space-between;
  margin-bottom:5px;
  font-size:13px;
}

.parent-two-column{
  grid-template-columns:1fr 1fr;
}

.history-row{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

/* AUDIO INFO */

.audio-card{
  margin-top:14px;
  background:linear-gradient(135deg,#181818,#303030);
  color:white;
}

.audio-controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.audio-control{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px;
  border-radius:15px;
  background:#3A3A3A;
}

.audio-status{
  padding:6px 9px;
  border-radius:999px;
  background:#555;
  font-size:11px;
}

.audio-status.on{
  color:#111;
  background:var(--yellow);
}

/* NAV */

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:0;
  z-index:100;
  transform:translateX(-50%);
  width:min(1100px,100%);
  display:grid;
  grid-template-columns:repeat(6,1fr);
  padding:7px 5px calc(7px + env(safe-area-inset-bottom));
  background:white;
  border-top:1px solid #ddd;
}

.nav-btn{
  padding:8px 3px;
  border-radius:12px;
  color:#777;
  background:transparent;
  font-size:11px;
}

.nav-btn strong{
  display:block;
  font-size:21px;
}

.nav-btn.active{
  color:#111;
  background:#FFF4AD;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:105px;
  z-index:999;
  transform:translateX(-50%);
  padding:12px 18px;
  color:white;
  background:#111;
  border-radius:14px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
}

@media(max-width:800px){

  .avatar-options{
    grid-template-columns:repeat(4,1fr);
  }

}

@media(max-width:760px){

  .hero{
    grid-template-columns:1fr;
  }

  .mascot{
    display:none;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .topics{
    grid-template-columns:1fr 1fr;
  }

  .profile-list{
    grid-template-columns:1fr 1fr;
  }

  .difficulty-card{
    grid-template-columns:55px 1fr;
  }

  .difficulty-card .btn{
    grid-column:1/-1;
  }

  .nav-btn span{
    display:none;
  }

}

@media(max-width:520px){

  .parent-selector{
    flex-direction:column;
    text-align:center;
  }

  .parent-selector select{
    max-width:none;
  }

  .avatar-options{
    grid-template-columns:repeat(2,1fr);
  }

  .audio-controls{
    grid-template-columns:1fr;
  }

}

@media(max-width:430px){

  .screen{
    padding:14px;
  }

  .topics,
  .profile-list,
  .parent-two-column,
  .form-grid{
    grid-template-columns:1fr;
  }

  .answers{
    grid-template-columns:1fr;
  }

  .header-actions{
    gap:3px;
  }

  .pill{
    padding:8px 8px;
    font-size:12px;
  }

}
</style>
</head>

let audioContext=null;

let masterGain=null;

let musicGain=null;

let sfxGain=null;

let musicTimer=null;

let musicStep=0;

let audioUnlocked=false;


/*
Create AudioContext only after
a real user interaction.
*/

function initAudio(){

if(audioContext){

if(audioContext.state==="suspended"){

audioContext.resume();

}

return;

}


const AudioContextClass=
window.AudioContext
||
window.webkitAudioContext;


if(!AudioContextClass){

return;

}


audioContext=
new AudioContextClass();


masterGain=
audioContext.createGain();


musicGain=
audioContext.createGain();


sfxGain=
audioContext.createGain();


masterGain.gain.value=
0.75;


/*
Keep background music softer
than sound effects.
*/

musicGain.gain.value=
0.08;


sfxGain.gain.value=
0.18;


musicGain.connect(
masterGain
);


sfxGain.connect(
masterGain
);


masterGain.connect(
audioContext.destination
);


audioUnlocked=true;


if(state.music){

startBackgroundMusic();

}

}


/* =========================================================
   BASIC AUDIO NOTE
========================================================= */

function playTone(
frequency,
duration=.12,
volume=.15,
type="sine",
delay=0,
destination="sfx"
){

if(!audioContext)
return;


const start=
audioContext.currentTime
+
delay;


const oscillator=
audioContext.createOscillator();


const gain=
audioContext.createGain();


oscillator.type=
type;


oscillator.frequency
.setValueAtTime(
frequency,
start
);


gain.gain
.setValueAtTime(
0.0001,
start
);


gain.gain
.exponentialRampToValueAtTime(
Math.max(volume,0.001),
start+.015
);


gain.gain
.exponentialRampToValueAtTime(
0.0001,
start+duration
);


oscillator.connect(gain);


gain.connect(
destination==="music"
?
musicGain
:
sfxGain
);


oscillator.start(start);

oscillator.stop(
start+duration+.03
);

}

/* =========================================================

========================================================= */

function randomNumber(min,max){

return Math.floor(
Math.random()
*
(max-min+1)
)
+
min;

}


function shuffle(array){

const result=
[...array];


for(
let i=result.length-1;
i>0;
i--
){

const j=
Math.floor(
Math.random()
*
(i+1)
);


[
result[i],
result[j]
]
=
[
result[j],
result[i]
];

}


return result;

}


function makeQuestion(
question,
answer,
options
){

let cleanOptions=
[
...new Set(
options.map(String)
)
];


while(
cleanOptions.length<4
){

const numericAnswer=
Number(answer);


if(
Number.isFinite(
numericAnswer
)
){

const fallback=
String(
numericAnswer
+
cleanOptions.length
+
1
);


if(
!cleanOptions.includes(
fallback
)
){

cleanOptions.push(
fallback
);

}

}
else{

const fallbacks=[
"None",
"Both",
"Same",
"Not sure"
];


const fallback=
fallbacks.find(
item=>
!cleanOptions.includes(item)
);


cleanOptions.push(
fallback
||
`Option ${cleanOptions.length+1}`
);

}

}


return{

question,

answer:
String(answer),

options:
shuffle(
cleanOptions.slice(0,4)
)

};

}

/* =========================================================

function subtractionQuestion(level){

let a,b,c,answer;


if(level===1){

a=randomNumber(2,10);

b=randomNumber(0,a);

answer=a-b;

else if(level===2){

else if(level===4){

a=randomNumber(40,80);

b=randomNumber(10,35);

return makeQuestion(

answer,

[
answer,
answer+5,
Math.max(0,answer-5),
answer+10
]

);

}

else{

b=randomNumber(20,40);

c=randomNumber(5,15);

answer=a-b-c;


return makeQuestion(

`${a} − ${b} − ${c} = ?`,

answer,

[
answer,
answer+10,
Math.max(0,answer-10),
answer+5
]

);

}


return makeQuestion(

`${a} − ${b} = ?`,

answer,

[
answer,
answer+2,
Math.max(0,answer-2),
answer+1
]

);

}

function numbersQuestion(level){

if(level===2){

randomNumber(1,20);

randomNumber(1,20);

randomNumber(1,20);

return{

question:

])

}

randomNumber(5,40);

n+6,
n+7,
n+8
]

);

}


if(level===4){

const tens=
randomNumber(2,8);


const ones=
randomNumber(1,9);


const number=
tens*10+ones;


return makeQuestion(

`What is the place value of ${tens} in ${number}?`,

tens*10,

[
tens,
tens*10,
ones,
number
]

);

}


let nums=[
randomNumber(20,99),
randomNumber(20,99),
randomNumber(20,99)
];


while(
new Set(nums).size<3
){

nums=[
randomNumber(20,99),
randomNumber(20,99),
randomNumber(20,99)
];

}


const answer=
Math.max(...nums);


return makeQuestion(

`Which is largest: ${nums.join(", ")}?`,

answer,

[
...nums,
Math.max(
0,
Math.min(...nums)-1
)
]

);

}

/* =========================================================
   QUESTION GENERATOR
========================================================= */

function generateQuestion(
topic,
level
){

switch(topic){

case "addition":
return additionQuestion(level);

case "subtraction":
return subtractionQuestion(level);

case "numbers":
return numbersQuestion(level);

case "fractions":
return fractionsQuestion(level);

case "money":
return moneyQuestion(level);

case "time":
case "measurement":
case "shapes":
case "data":
return bankQuestion(
topic,
level
);

default:

return makeQuestion(
"1 + 1 = ?",
2,
[1,2,3,4]
);

}

}

function startQuiz(

level
){

state.currentTopic=
topic;


state.difficulty=

i++
){

)

);

showPage("quiz");

/* =========================================================
   ANSWER
========================================================= */

function answerQuestion(button){

if(state.answerLocked)
return;


state.answerLocked=true;


const q=
state.questions[
state.questionIndex
];


const selected=
button.dataset.answer;


const correct=
String(selected)
===
String(q.answer);


const feedback=
$("#feedback");


if(correct){

state.correctAnswers++;


button.classList.add(
"correct"
);


feedback.className=
"feedback correct";


feedback.textContent=
t("correct");


playSFX("correct");

}
else{

button.classList.add(
"wrong"
);


document
.querySelectorAll(".answer")
.forEach(answerButton=>{

if(
String(
answerButton.dataset.answer
)
===
String(q.answer)
){

answerButton.classList.add(
"correct"
);

}

});


feedback.className=
"feedback wrong";


feedback.innerHTML=`

${t("wrong")}

<br>

Correct answer:

<strong>
${q.answer}
</strong>

`;


playSFX("wrong");

}


setTimeout(()=>{

state.questionIndex++;

state.answerLocked=false;

renderQuestion();

},1100);

}


/* =========================================================
   FINISH QUIZ
========================================================= */

function finishQuiz(){

const child=
currentChild();


const total=
state.questions.length;


const accuracy=
Math.round(
state.correctAnswers
/
total
*
100
);


let xpEarned=
state.correctAnswers*10
+
state.difficulty*10;


if(accuracy===100){

xpEarned+=100;

}


const starsEarned=
getStars(
accuracy
);


child.xp=
(child.xp||0)
+
xpEarned;


child.stars=
(child.stars||0)
+
starsEarned;


child.totalQuestions=
(child.totalQuestions||0)
+
total;


child.correctAnswers=
(child.correctAnswers||0)
+
state.correctAnswers;


child.topics ||= {};


const old=
child.topics[
state.currentTopic
]
||
0;


child.topics[
state.currentTopic
]
=
old===0
?
accuracy
:
Math.round(
(old+accuracy)/2
);


child.history ||= [];


child.history.unshift({

topic:
state.currentTopic,

difficulty:
state.difficulty,

score:
`${state.correctAnswers}/${total}`,

accuracy,

date:
new Date()
.toLocaleDateString()

});

child.history.slice(
0,
30
);

/* =========================================================
   DELETE CHILD
========================================================= */

function deleteChild(id){

if(!children[id])
return;


if(
Object.keys(children).length<=1
){

toast(
state.language==="en"
?
"At least one child profile is required."
:
"Sekurang-kurangnya satu profil anak diperlukan."
);

return;

}


const child=
children[id];


const message=
state.language==="en"

?

`Delete ${child.name}'s profile?

All XP, stars, history and learning progress will be permanently removed.`

:

`Padam profil ${child.name}?

Semua XP, bintang, sejarah dan kemajuan pembelajaran akan dipadam.`;


if(
!window.confirm(message)
){

return;

}


delete children[id];


const first=
Object.keys(children)[0];


if(
state.currentChildId===id
){

state.currentChildId=
first;

}


if(
state.parentChildId===id
){

state.parentChildId=
state.currentChildId;

}


saveLocal();

syncFirebase();

renderAll();


playSFX(
"delete"
);


toast(
state.language==="en"
?
"Child profile deleted."
:
"Profil anak telah dipadam."
);

}

/* =========================================================
   FIREBASE SAVE
========================================================= */

async function syncFirebase(){

if(
!auth.currentUser
){

return;

}


try{

await set(

ref(
database,
`users/${auth.currentUser.uid}/ninjaMath`
),

{

children,

currentChildId:
state.currentChildId,

parentChildId:
state.parentChildId,

settings:{

language:
state.language,

music:
state.music,

sfx:
state.sfx

},

updatedAt:
Date.now()

}

);

}
catch(error){

console.log(
"Firebase sync error:",
error
);

}

}


/* =========================================================
   FIREBASE LOAD
========================================================= */

async function loadFirebase(user){

try{

const snapshot=
await get(

ref(
database,
`users/${user.uid}/ninjaMath`
)

);


if(
snapshot.exists()
){

const data=
snapshot.val();


if(
data.children
&&
Object.keys(data.children).length
){

children=
data.children;

}


Object.values(children)
.forEach((child,index)=>{

if(!child.avatarId){

child.avatarId=
index%2===0
?
"redBoy"
:
"pinkGirl";

}


if(!child.age){

child.age=7;

}

});


if(
data.currentChildId
&&
children[data.currentChildId]
){

state.currentChildId=
data.currentChildId;

}
else{

state.currentChildId=
Object.keys(children)[0];

}


if(
data.parentChildId
&&
children[data.parentChildId]
){

state.parentChildId=
data.parentChildId;

}
else{

state.parentChildId=
state.currentChildId;

}


/*
Load cloud audio settings if available.
*/

if(data.settings){

if(
typeof data.settings.music
===
"boolean"
){

state.music=
data.settings.music;

}


if(
typeof data.settings.sfx
===
"boolean"
){

state.sfx=
data.settings.sfx;

}


if(
data.settings.language
){

state.language=
data.settings.language;

}

}


saveLocal();

}

}
catch(error){

console.log(
"Firebase load error:",
error
);

}


renderAll();

}
