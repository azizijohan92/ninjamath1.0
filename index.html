<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111111">

<title>Ninja Math</title>

<style>
:root{
  --black:#111;
  --yellow:#FFD51E;
  --gold:#FFB800;
  --bg:#F7F5ED;
  --green:#50C878;
  --red:#FF6B6B;
  --muted:#777;
  --shadow:0 10px 28px rgba(0,0,0,.10);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:#222;
  font-family:"Arial Rounded MT Bold",Arial,sans-serif;
}

button,input,select{font:inherit}

button{
  cursor:pointer;
  border:0;
}

.app{
  max-width:1100px;
  min-height:100vh;
  margin:auto;
  background:#FAF9F3;
  padding-bottom:100px;
}

/* HEADER */

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:16px 20px;
  color:white;
  background:linear-gradient(135deg,#101010,#292929);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
}

.logo{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:var(--yellow);
  color:#111;
  font-size:27px;
}

.brand small{
  display:block;
  color:#ccc;
  font-size:10px;
  margin-top:2px;
}

.header-actions{
  display:flex;
  gap:7px;
}

.pill{
  padding:9px 12px;
  color:white;
  background:#333;
  border:1px solid #555;
  border-radius:999px;
}

/* GENERAL */

.screen{
  display:none;
  padding:18px;
}

.screen.active{
  display:block;
}

.card{
  padding:18px;
  background:white;
  border-radius:22px;
  box-shadow:var(--shadow);
}

.grid{
  display:grid;
  gap:14px;
}

.btn{
  padding:14px 18px;
  border-radius:15px;
  background:var(--yellow);
  color:#111;
  font-weight:900;
  box-shadow:0 5px 0 #C79E00;
}

.btn:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #C79E00;
}

.btn.dark{
  color:white;
  background:#171717;
  box-shadow:0 5px 0 #000;
}

.btn.ghost{
  background:white;
  border:2px solid #ddd;
  box-shadow:none;
}

.btn.danger{
  color:#B91C1C;
  background:#FFF2F2;
  border:2px solid #FFD0D0;
  box-shadow:none;
}

.btn.small{
  padding:9px 12px;
  font-size:13px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:10px;
  margin:22px 2px 12px;
}

.section-title h2{margin:0}

.section-title span{
  color:var(--muted);
  font-size:12px;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:10px;
  background:#F1F1F1;
  font-size:11px;
  font-weight:900;
}

/* HERO */

.hero{
  display:grid;
  grid-template-columns:1.5fr .5fr;
  gap:20px;
  padding:24px;
  overflow:hidden;
  border-radius:30px;
  background:linear-gradient(135deg,#FFF7B2,#FFE138);
  box-shadow:var(--shadow);
}

.hero h1{
  margin:8px 0;
  font-size:clamp(30px,6vw,48px);
}

.hero p{color:#594B00}

.mascot{
  display:grid;
  place-items:center;
  font-size:110px;
}

/* STATS */

.stats{
  grid-template-columns:repeat(4,1fr);
  margin:18px 0;
}

.stat b{
  display:block;
  font-size:25px;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

/* PROGRESS */

.progress{
  height:13px;
  overflow:hidden;
  border-radius:999px;
  background:#EAEAEA;
}

.progress i{
  display:block;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--gold),var(--yellow));
}

/* MISSION */

.mission{
  color:white;
  background:#181818;
}

.mission .progress{
  background:#393939;
}

/* TOPICS */

.topics{
  grid-template-columns:repeat(3,1fr);
}

.topic{
  min-height:175px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.topic-icon{font-size:42px}

.topic h3{
  margin:8px 0 4px;
}

.topic p{
  margin:0;
  color:#777;
  font-size:12px;
  line-height:1.5;
}

.topic footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:15px;
}

/* DIFFICULTY */

.difficulty-header{
  max-width:800px;
  margin:auto;
  text-align:center;
  padding:10px 0 18px;
}

.difficulty-topic-icon{
  font-size:70px;
}

.difficulty-header h1{
  margin:6px 0;
}

.difficulty-header p{
  color:#777;
}

.difficulty-grid{
  max-width:850px;
  margin:auto;
  display:grid;
  gap:14px;
}

.difficulty-card{
  display:grid;
  grid-template-columns:65px 1fr auto;
  gap:15px;
  align-items:center;
  padding:18px;
  border:3px solid transparent;
  border-radius:22px;
  background:white;
  box-shadow:var(--shadow);
}

.difficulty-card:hover{
  border-color:var(--yellow);
}

.difficulty-number{
  width:58px;
  height:58px;
  display:grid;
  place-items:center;
  border-radius:18px;
  font-size:24px;
  font-weight:900;
}

.level-1 .difficulty-number{background:#E0F8E7}
.level-2 .difficulty-number{background:#DDEFFF}
.level-3 .difficulty-number{background:#FFF1C8}
.level-4 .difficulty-number{background:#FFE0CC}
.level-5 .difficulty-number{background:#F1E2FF}

.difficulty-info h3{
  margin:0 0 5px;
}

.difficulty-info p{
  margin:0;
  color:#777;
  font-size:13px;
}

.difficulty-stars{
  margin-top:7px;
}

/* NAV */

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:0;
  z-index:100;
  transform:translateX(-50%);
  width:min(1100px,100%);
  display:grid;
  grid-template-columns:repeat(6,1fr);
  padding:7px 5px calc(7px + env(safe-area-inset-bottom));
  background:white;
  border-top:1px solid #ddd;
}

.nav-btn{
  padding:8px 3px;
  border-radius:12px;
  color:#777;
  background:transparent;
  font-size:11px;
}

.nav-btn strong{
  display:block;
  font-size:21px;
}

.nav-btn.active{
  color:#111;
  background:#FFF4AD;
}

/* PROFILE */

.profile-list{
  grid-template-columns:repeat(3,1fr);
}

.child-card{
  text-align:center;
  border:3px solid transparent;
}

.child-card.selected{
  border-color:var(--yellow);
}

.child-avatar{
  font-size:58px;
}

.child-select{
  cursor:pointer;
}

.delete-profile{
  width:100%;
  margin-top:10px;
}

/* FORMS */

.form-grid{
  grid-template-columns:1fr 1fr;
}

label{
  display:block;
  color:#555;
  font-size:12px;
  font-weight:900;
}

input,
select{
  width:100%;
  padding:13px;
  margin-top:6px;
  border:2px solid #ddd;
  border-radius:14px;
  background:white;
}

/* QUIZ */

.quiz-wrap{
  max-width:720px;
  margin:auto;
}

.quiz-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.quiz-level{
  padding:7px 10px;
  border-radius:999px;
  background:var(--yellow);
  font-size:11px;
  font-weight:900;
}

.question{
  padding:38px 10px 28px;
  text-align:center;
  font-size:clamp(27px,6vw,46px);
  font-weight:900;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.answer{
  min-height:80px;
  padding:12px;
  border:3px solid #eee;
  border-radius:20px;
  background:white;
  font-size:24px;
  font-weight:900;
}

.answer.correct{
  border-color:#42B96D;
  background:#DBF7E5;
}

.answer.wrong{
  border-color:#FF7070;
  background:#FFE1E1;
}

.feedback{
  min-height:65px;
  margin-top:16px;
  padding:15px;
  text-align:center;
  border-radius:18px;
  font-weight:900;
}

.feedback.correct{background:#DDF7E6}
.feedback.wrong{background:#FFF0D8}

/* RESULT */

.center{text-align:center}

.result-avatar{font-size:90px}

.result-score{
  font-size:70px;
  font-weight:900;
}

.result-stars{
  font-size:45px;
}

/* RANKING */

.ranking-top-card{
  margin-bottom:14px;
  text-align:center;
  background:linear-gradient(135deg,#FFF5A0,#FFD51E);
}

.ranking-top-card .trophy{
  font-size:55px;
}

.rank-row{
  display:grid;
  grid-template-columns:50px 55px 1fr auto;
  gap:10px;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.rank-position{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#F1F1F1;
  font-weight:900;
}

.rank-avatar{
  font-size:34px;
}

.rank-current{
  background:#FFF9D7;
  border-radius:16px;
  padding-left:8px;
  padding-right:8px;
}

/* PARENT DASHBOARD */

.parent-selector{
  display:flex;
  align-items:center;
  gap:15px;
  padding:18px;
  margin-bottom:18px;
  background:linear-gradient(135deg,#181818,#292929);
  color:white;
  border-radius:22px;
  box-shadow:var(--shadow);
}

.parent-selector-avatar{
  width:65px;
  height:65px;
  display:grid;
  place-items:center;
  flex-shrink:0;
  border-radius:18px;
  background:var(--yellow);
  font-size:38px;
}

.parent-selector-info{
  flex:1;
}

.parent-selector-info h3{
  margin:0 0 4px;
}

.parent-selector-info p{
  margin:0 0 8px;
  color:#ccc;
  font-size:12px;
}

.parent-selector select{
  max-width:280px;
  margin:0;
  color:#111;
  background:white;
}

.performance-row{
  margin:14px 0;
}

.performance-row header{
  display:flex;
  justify-content:space-between;
  margin-bottom:5px;
  font-size:13px;
}

.parent-two-column{
  grid-template-columns:1fr 1fr;
}

.history-row{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.history-row:last-child{
  border-bottom:0;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:105px;
  z-index:999;
  transform:translateX(-50%);
  padding:12px 18px;
  color:white;
  background:#111;
  border-radius:14px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{opacity:1}

/* RESPONSIVE */

@media(max-width:760px){

  .hero{
    grid-template-columns:1fr;
  }

  .mascot{display:none}

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .topics{
    grid-template-columns:1fr 1fr;
  }

  .profile-list{
    grid-template-columns:1fr 1fr;
  }

  .nav-btn span{
    display:none;
  }

  .difficulty-card{
    grid-template-columns:55px 1fr;
  }

  .difficulty-card .btn{
    grid-column:1/-1;
  }

}

@media(max-width:520px){

  .parent-selector{
    flex-direction:column;
    align-items:stretch;
    text-align:center;
  }

  .parent-selector-avatar{
    margin:auto;
  }

  .parent-selector select{
    max-width:none;
  }

}

@media(max-width:430px){

  .screen{padding:14px}

  .topics,
  .profile-list,
  .parent-two-column{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .answers{
    grid-template-columns:1fr;
  }

  .answer{
    min-height:65px;
  }

}
</style>
</head>

/* =========================================================
   SOUND
========================================================= */

function playSound(type){

if(!state.sound)
return;


try{

const AudioContextClass =
window.AudioContext ||
window.webkitAudioContext;


const context =
new AudioContextClass();


const oscillator =
context.createOscillator();


const gain =
context.createGain();


oscillator.connect(gain);

gain.connect(context.destination);


oscillator.frequency.value =
type === "correct"
?
650
:
280;


gain.gain.setValueAtTime(
0.08,
context.currentTime
);


gain.gain.exponentialRampToValueAtTime(
0.001,
context.currentTime + .2
);


oscillator.start();

oscillator.stop(
context.currentTime + .2
);

}
catch(error){}

}

/* =========================================================
   QUESTION UTILITIES
========================================================= */

function randomNumber(min,max){

return Math.floor(
Math.random()*(max-min+1)
)+min;

}


function shuffle(array){

return [...array]
.sort(()=>Math.random()-.5);

}


function makeQuestion(
question,
answer,
options
){

let cleanOptions =
[...new Set(
options.map(String)
)];


while(cleanOptions.length < 4){

const fallback =
String(
Number(answer)+
cleanOptions.length+
1
);


if(!cleanOptions.includes(fallback)){

cleanOptions.push(fallback);

}

}


return{

question,

answer:String(answer),

options:
shuffle(cleanOptions.slice(0,4))

};

}


/* =========================================================

========================================================= */

function additionQuestion(level){

let a,b,c,answer;


if(level === 1){

a=randomNumber(0,5);

b=randomNumber(0,5);

answer=a+b;


return makeQuestion(

`${a} + ${b} = ?`,

answer,

[
answer,
answer+1,
Math.max(0,answer-1),
answer+2
]

);

}


if(level === 2){

a=randomNumber(2,10);

b=randomNumber(2,10);

answer=a+b;


return makeQuestion(

`${a} + ${b} = ?`,

[
answer,

answer+2,
Math.max(0,answer-2)
]

);

}

b=randomNumber(5,20);

return makeQuestion(

`${a} + ${b} = ?`,

answer+2,
Math.max(0,answer-5)
]

);

}

a=randomNumber(20,60);

b=randomNumber(10,40);

answer=a+b;


if(randomNumber(1,2) === 1){

return makeQuestion(

`${a} + ${b} = ?`,

answer,

]

]

a=randomNumber(30,70);

b=randomNumber(20,50);

return makeQuestion(

`${a} + ${b} + ${c} = ?`,

]

/* =========================================================
   NUMBERS
========================================================= */

function numbersQuestion(level){

if(level === 1){

const n =
randomNumber(0,9);


return makeQuestion(

`What number comes after ${n}?`,

n+1,

[
n,
n+1,
n+2,
Math.max(0,n-1)
]

);

}


if(level === 2){

const a =
randomNumber(1,20);


let b =
randomNumber(1,20);


while(a === b){

b =
randomNumber(1,20);

}


const answer =
Math.max(a,b);


return makeQuestion(

`Which is greater: ${a} or ${b}?`,

answer,

[
a,
b,
Math.max(0,Math.min(a,b)-1),
Math.max(a,b)+1
]

);

}


if(level === 3){

const start =
randomNumber(5,40);


return makeQuestion(

`${start}, ${start+2}, ${start+4}, __, ${start+8}`,

start+6,

[
start+5,
start+6,
start+7,
start+8
]

);

}


if(level === 4){

const tens =
randomNumber(2,8);


const ones =
randomNumber(1,9);


const number =
(tens*10)+ones;


return makeQuestion(

`What is the place value of ${tens} in ${number}?`,

tens*10,

[
tens,
tens*10,
ones,
number
]

);

}


const a =
randomNumber(20,99);


const b =
randomNumber(20,99);


const c =
randomNumber(20,99);


const answer =
Math.max(a,b,c);


return makeQuestion(

`Which is the largest: ${a}, ${b}, ${c}?`,

answer,

[
a,
b,
c,
Math.max(0,Math.min(a,b,c)-1)
]

);

}

/* =========================================================
   GENERATE QUESTION
========================================================= */

function generateQuestion(topic,level){

switch(topic){

case "addition":
return additionQuestion(level);

case "subtraction":
return subtractionQuestion(level);

case "numbers":
return numbersQuestion(level);

case "fractions":
return fractionsQuestion(level);

case "money":
return moneyQuestion(level);

case "time":
return timeQuestion(level);

case "measurement":
return measurementQuestion(level);

case "shapes":
return shapesQuestion(level);

case "data":
return dataQuestion(level);

default:

return makeQuestion(
"1 + 1 = ?",
2,
[1,2,3,4]
);

}

}

/* =========================================================

========================================================= */

function finishQuiz(){

const child =
currentChild();


const total =
state.questions.length;


const accuracy =

Math.round(
state.correctAnswers /
total *
100
);


let xpEarned =

(state.correctAnswers*10)

+

(state.difficulty*10);


if(accuracy === 100){

xpEarned += 100;

}


const starsEarned =
getStars(accuracy);


child.xp =
(child.xp || 0)
+
xpEarned;


child.stars =
(child.stars || 0)
+
starsEarned;


child.totalQuestions =
(child.totalQuestions || 0)
+
total;


child.correctAnswers =
(child.correctAnswers || 0)
+
state.correctAnswers;


if(!child.topics){

child.topics = {};

}


const oldScore =
child.topics[state.currentTopic] || 0;


child.topics[state.currentTopic] =

oldScore === 0

?

accuracy

:

Math.round(
(oldScore+accuracy)/2
);


if(!Array.isArray(child.history)){

child.history = [];

}


child.history.unshift({

topic:
state.currentTopic,

difficulty:
state.difficulty,

score:
`${state.correctAnswers}/${total}`,

accuracy,

new Date().toLocaleDateString()

/* =========================================================

========================================================= */

function deleteChild(id){

const child =
children[id];


if(!child)
return;


if(
Object.keys(children).length <= 1
){

toast(

state.language === "en"
?
"At least one child profile is required."
:
"Sekurang-kurangnya satu profil anak diperlukan."

);

return;

}


const message =

state.language === "en"

?

`Delete ${child.name}'s profile?

All XP, stars, quiz history and learning progress will be permanently removed.`

:

`Padam profil ${child.name}?

Semua XP, bintang, sejarah kuiz dan kemajuan pembelajaran akan dipadam.`;


if(!window.confirm(message))
return;


delete children[id];


const firstRemainingChild =
Object.keys(children)[0];


/*
If deleted profile is active player,
switch active player.
*/

if(
state.currentChildId === id
){

state.currentChildId =
firstRemainingChild;

}


/*
If deleted profile is currently being viewed
inside Parent Dashboard,
switch Parent Dashboard to another child.
*/

if(
state.parentChildId === id
){

state.parentChildId =
state.currentChildId
||
firstRemainingChild;

}


saveLocal();

syncFirebase();

renderAll();


toast(

state.language === "en"
?
"Child profile deleted."
:
"Profil anak telah dipadam."

);

}

async function syncFirebase(){

return;


try{

await set(

ref(

database,

`users/${auth.currentUser.uid}/ninjaMath`

),

{

children,

currentChildId:
state.currentChildId,

);

/* =========================================================
   FIREBASE LOAD
========================================================= */

async function loadFirebase(user){

try{

const snapshot =

await get(

ref(

database,

`users/${user.uid}/ninjaMath`

)

);


if(snapshot.exists()){

const data =
snapshot.val();


if(

data.children

&&

Object.keys(data.children).length

){

children =
data.children;

}


/*
Load active child.
*/

if(

data.currentChildId

&&

children[data.currentChildId]

){

state.currentChildId =
data.currentChildId;

}

else{

state.currentChildId =
Object.keys(children)[0];

}


/*
Load child selected in Parent Dashboard.
*/

if(

data.parentChildId

&&

children[data.parentChildId]

){

state.parentChildId =
data.parentChildId;

}

else{

state.parentChildId =
state.currentChildId;

}


saveLocal();

}

}

catch(error){

console.log(
"Firebase load error:",
error
);

}


renderAll();

}
